<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCA Foundations — Practice Exam</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--accent:#7c6af7;--accent2:#5eead4;--correct:#22c55e;--wrong:#ef4444;--text:#e2e8f0;--muted:#8892a4;--warn:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:0 0 60px}
header{background:linear-gradient(135deg,#1e1b4b,#1a1d27);border-bottom:1px solid var(--border);padding:24px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
header h1{font-size:1.4rem;font-weight:700;color:#fff;letter-spacing:-.02em}
header .badge{background:var(--accent);color:#fff;font-size:.75rem;padding:4px 12px;border-radius:20px;font-weight:600}
.score-bar{display:flex;gap:20px;font-size:.85rem;color:var(--muted)}
.score-bar span{color:var(--text);font-weight:600}
nav{display:flex;gap:8px;overflow-x:auto;padding:16px 32px;border-bottom:1px solid var(--border);background:var(--card);scrollbar-width:thin}
nav button{flex-shrink:0;padding:8px 18px;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:8px;cursor:pointer;font-size:.85rem;transition:all .2s;white-space:nowrap}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
nav button.done{border-color:var(--correct);color:var(--correct)}
.main{max-width:860px;margin:0 auto;padding:32px 24px}
.scenario-header{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:32px}
.scenario-header h2{font-size:1.1rem;color:var(--accent2);margin-bottom:8px;font-weight:600}
.scenario-header p{font-size:.9rem;color:var(--muted);line-height:1.6}
.scenario-header .domains{margin-top:12px;font-size:.8rem;color:var(--warn)}
.question-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px;transition:border-color .2s}
.question-card.answered{border-color:var(--border)}
.q-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.q-num{background:var(--accent);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0;margin-top:1px}
.q-text{font-size:.93rem;line-height:1.65;color:var(--text)}
.q-text code{background:#252836;padding:1px 6px;border-radius:4px;font-family:'Fira Code',monospace;font-size:.87em;color:var(--accent2)}
.options{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.option{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s;font-size:.88rem;line-height:1.55;color:var(--muted)}
.option:hover:not(.disabled){border-color:var(--accent);color:var(--text);background:rgba(124,106,247,.07)}
.option .opt-label{font-weight:700;color:var(--accent);flex-shrink:0;min-width:20px}
.option.correct{border-color:var(--correct);background:rgba(34,197,94,.08);color:var(--text)}
.option.correct .opt-label{color:var(--correct)}
.option.wrong{border-color:var(--wrong);background:rgba(239,68,68,.08);color:var(--text)}
.option.wrong .opt-label{color:var(--wrong)}
.option.disabled{cursor:default}
.option code{background:#252836;padding:1px 5px;border-radius:3px;font-family:'Fira Code',monospace;font-size:.85em;color:var(--accent2)}
.explanation{margin-top:14px;padding:14px 16px;background:#111827;border-left:3px solid var(--accent2);border-radius:0 8px 8px 0;font-size:.86rem;line-height:1.65;color:#94a3b8;display:none}
.explanation.show{display:block}
.explanation strong{color:var(--accent2)}
.progress{display:flex;align-items:center;gap:12px;margin-bottom:24px;font-size:.85rem;color:var(--muted)}
.progress-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.result-panel{display:none;text-align:center;padding:40px 24px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:24px}
.result-panel.show{display:block}
.result-panel .big-score{font-size:3.5rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.result-panel p{color:var(--muted);margin-top:8px}
.btn-reset{margin-top:20px;padding:10px 28px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600;transition:opacity .2s}
.btn-reset:hover{opacity:.85}
.task-ref{display:inline-block;background:rgba(94,234,212,.12);color:var(--accent2);font-size:.73rem;font-weight:700;padding:2px 9px;border-radius:4px;margin-right:8px;font-family:'Fira Code',monospace;letter-spacing:.03em;vertical-align:middle;border:1px solid rgba(94,234,212,.25)}
</style>
</head>
<body>
<header>
  <div>
    <div style="margin-bottom:8px"><a href="../index.html" style="color:var(--muted);font-size:.8rem;text-decoration:none;opacity:.7">← 返回首頁</a></div>
    <h1>Claude Certified Architect — Foundations</h1>
    <div style="margin-top:6px;font-size:.82rem;color:var(--muted)">Practice Exam · 6 Scenarios · 95 Questions · Answers Shuffled Each Session</div>
  </div>
  <div class="score-bar">
    Total Score: <span id="totalScore">0 / 0</span>
  </div>
</header>
<nav id="scenarioNav"></nav>
<div class="main" id="mainContent"></div>

<script>
const scenarios = [
{
  id:1,
  title:"Scenario 1: Customer Support Resolution Agent",
  desc:"You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to your backend systems through custom MCP tools (<code>get_customer</code>, <code>lookup_order</code>, <code>process_refund</code>, <code>escalate_to_human</code>). Your target is 80%+ first-contact resolution while knowing when to escalate.",
  domains:"Primary domains: Agentic Architecture & Orchestration · Tool Design & MCP Integration · Context Management & Reliability",
  questions:[
    {
      q:"Your agentic loop uses this termination logic: <code>while True: response = call_claude(); if \"I have completed\" in response.content[0].text: break</code>. Production logs show the agent sometimes terminates mid-task when the model uses phrases like \"I have completed looking up the customer.\" What is the correct approach to implement loop termination?",
      opts:["Drive termination from <code>stop_reason</code>: loop while it is <code>\"tool_use\"</code> and stop on <code>\"end_turn\"</code>, ignoring the response text","Keep <code>stop_reason</code> as the main check but retain a curated list of completion phrases as a text-matching fallback for unexpected API behavior","Use a hard cap of 10 iterations as the primary stop condition, since stop_reason values can drift across model versions and are hard to rely on","Continue only while the latest assistant turn still contains a <code>tool_use</code> block, treating the absence of one as the definitive completion signal"],
      answer:0,
      exp:"正確的 agentic loop 應依據 <strong>stop_reason</strong> 來判斷是否繼續：<code>stop_reason</code> 為 <code>\"tool_use\"</code> 時繼續執行，<code>stop_reason</code> 為 <code>\"end_turn\"</code> 時才終止。解析自然語言文字來判斷完成是不可靠的 anti-pattern，因為模型可能在任何地方使用類似完成的措辭。設定固定迭代上限作為主要停止機制也是 anti-pattern。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：保留關鍵字清單當後備，仍是不可靠的文字比對，模型措辭一變就誤判。C 錯在哪：固定迭代上限只是防呆上限，當成主要停止依據會在任務未完成時硬切。D 錯在哪：用「有沒有 <code>tool_use</code> 區塊」當訊號方向接近，但 <code>stop_reason</code> 才是 API 給的權威穩健訊號，檢查內容區塊較脆弱。"
    },
    {
      q:"After calling <code>get_customer</code>, your agent calls Claude again to decide the next step, but Claude responds as if it has no information about the customer that was just retrieved. What is the most likely cause?",
      opts:["The <code>get_customer</code> result block was never appended to the messages array, so the next API call runs without the retrieved data in context","The prior turn returned <code>stop_reason: \"end_turn\"</code> instead of <code>\"tool_use\"</code>, so the loop never sent the tool result back to the model","The accumulated tool-result payloads pushed the conversation past the context window, silently dropping the earliest customer data","The <code>get_customer</code> description omits its return schema, so the model cannot recognize the fields it received and ignores them"],
      answer:0,
      exp:"在 agentic loop 中，每次 tool 執行完畢後，必須將 <strong>tool result 加入到 conversation history</strong> 中，這樣模型才能在下一次 API 請求時推理這些結果。如果沒有將 tool result 加回對話歷史，模型就會對之前的 tool 呼叫一無所知。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：<code>stop_reason</code> 控制的是 loop 是否繼續，不影響模型是否看得到結果——即使 stop_reason 正確，沒回填結果照樣「失憶」。C 錯在哪：tool 定義不會撐爆 context window，且題目症狀是「失憶」而非內容被截斷。D 錯在哪：缺少回傳格式說明會讓欄位解讀困難，但模型仍知道自己呼叫過工具，不會完全無視結果。"
    },
    {
      q:"The system prompt says \"Always verify customer identity with <code>get_customer</code> before processing any refund.\" Production logs show this instruction is followed 94% of the time, but 6% of cases still skip verification. What change would guarantee compliance?",
      opts:["Add a programmatic guard that rejects any <code>process_refund</code> call until <code>get_customer</code> has returned a verified customer ID for the session","Add five few-shot examples to the system prompt that always show <code>get_customer</code> being called immediately before <code>process_refund</code>","Rewrite the instruction as \"You MUST ALWAYS verify identity first — this is non-negotiable and applies to every refund without exception\"","Set <code>tool_choice: \"any\"</code> so the model is forced to call a tool each turn, making it reach for <code>get_customer</code> before refunding"],
      answer:0,
      exp:"當業務邏輯需要<strong>確定性合規保障</strong>（如身份驗證必須在金融操作之前），僅靠 prompt 指令無法保證零失敗率。<strong>程式化的前置條件</strong>才能提供確定性保障：在 <code>get_customer</code> 未回傳已驗證的 customer ID 之前，<code>process_refund</code> 工具根本不會被執行。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：few-shot 範例只是提高遵循機率，仍有那 6% 的漏網率。C 錯在哪：再強硬的「MUST ALWAYS」prompt 措辭仍是概率性的，無法保證零失敗。D 錯在哪：<code>tool_choice: \"any\"</code> 只保證每回合呼叫某個工具，不保證先驗證身份，無法強制 <code>get_customer</code> 在退款前完成。"
    },
    {
      q:"Your MCP tools return dates in different formats: <code>get_customer</code> returns Unix timestamps, <code>lookup_order</code> returns ISO 8601 strings, and a shipping tool returns \"MM/DD/YYYY\". This inconsistency causes errors when the agent compares dates across tools. What is the most effective architectural solution?",
      opts:["Add a <code>PostToolUse</code> hook that rewrites every tool's dates into one canonical format before the result ever reaches the model","Document each tool's date format in its description so the model knows whether it is getting a timestamp, an ISO string, or MM/DD/YYYY","Instruct the system prompt to always convert each date to ISO 8601 itself before comparing values returned by different tools","Add a dedicated <code>date_normalize</code> tool the agent calls on any date it needs to compare, returning a standardized value"],
      answer:0,
      exp:"<strong>PostToolUse hook</strong> 可以在模型處理 tool 結果之前攔截並轉換資料格式，提供確定性保障，確保模型永遠只看到標準化後的資料。B 只是文件化問題；C 依賴模型的概率性合規；D 增加不必要的複雜性和額外 API 呼叫。"
    },
    {
      q:"Your business policy states that refunds above $500 must be reviewed by a human agent before processing. You want to enforce this rule programmatically. Which approach best implements this requirement?",
      opts:["Add a pre-tool-use hook that checks the refund amount and reroutes calls over $500 to <code>escalate_to_human</code> before the refund runs","Add a system-prompt rule stating that refunds above $500 must always be escalated to a human agent rather than processed automatically","Have <code>process_refund</code> itself reject amounts over $500 by returning a policy error, leaving the model to decide what to do next","Provide few-shot examples covering several high-value cases where the agent correctly escalated refunds above the $500 threshold"],
      answer:0,
      exp:"業務規則需要確定性合規保障時，應使用 <strong>hook 而非 prompt 指令</strong>。Hook 可以在 tool 呼叫發出之前攔截並強制執行政策，完全繞過模型的決策，提供 100% 的合規率。B 和 D 依賴模型的概率性遵循，有失敗風險；C 錯在哪：讓 <code>process_refund</code> 自己對 >$500 回錯誤雖屬確定性阻擋，但只是擋下、沒導向 <code>escalate_to_human</code>，也把政策邏輯埋進工具而非攔截層。"
    },
    {
      q:"Your agent frequently calls <code>get_customer</code> when users ask about order status, even when they provide an order number directly (e.g., \"Where is order #12345?\"). Both tools have one-sentence descriptions. What is the most effective first step to fix this misrouting?",
      opts:["Expand both tool descriptions with input formats, example queries, and explicit \"use this vs. the other\" guidance so the model can disambiguate them","Add few-shot examples to the system prompt that route order-number queries to <code>lookup_order</code> and profile queries to <code>get_customer</code>","Rename the tools to <code>fetch_account_profile</code> and <code>fetch_order_details</code> so their names alone signal which query type each one handles","Add a pre-processing layer that detects an order number in the message and pre-selects <code>lookup_order</code> before the agent reasons about tools"],
      answer:0,
      exp:"<strong>Tool descriptions 是 LLM 進行 tool selection 的主要機制</strong>。當 descriptions 過於簡短時，模型缺乏足夠的上下文來區分相似的 tools。直接提升 tool descriptions（加入輸入格式、範例 queries、邊界條件）是最直接有效的修正方式。B 增加了 token 開銷但沒有解決根本原因；C 錯在哪：改名能給一點語意線索，但沒補上輸入格式、使用時機等關鍵 context，不如直接充實描述；D 是過度設計。"
    },
    {
      q:"Your <code>process_refund</code> MCP tool sometimes returns a generic error: \"Operation failed.\" The agent then retries the same refund multiple times, causing duplicate charges. What should the tool return to prevent this?",
      opts:["Structured error metadata — an <code>errorCategory</code> like \"validation\", an <code>isRetryable: false</code> flag, and a short reason for the failure","An HTTP 400 status code so the agent recognizes a client-side error that, by HTTP convention, should never be retried automatically without changes","The message \"Operation failed. Please do not retry.\" so the agent reads the instruction and avoids issuing the same refund again","An empty result with <code>isError: true</code>, signaling failure without exposing the internal reason the refund could not be processed"],
      answer:0,
      exp:"<strong>結構化的錯誤 metadata</strong> 讓 agent 能做出明智的恢復決策。<code>isRetryable: false</code> 明確告知 agent 不要重試；<code>errorCategory</code> 幫助 agent 理解是驗證錯誤還是暫時性錯誤。一般的錯誤訊息無法讓 agent 區分哪些錯誤可以重試。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：HTTP 400 是給人或 HTTP 客戶端的慣例，agent 未必據此推斷可否重試，缺結構化欄位。C 錯在哪：把「不要重試」寫進文字訊息仍是非結構化，agent 解讀不可靠。D 錯在哪：空結果加 <code>isError</code> 只知道失敗了，沒說明原因或可否重試，無法支援明智恢復。"
    },
    {
      q:"A subagent reports a \"database connection timeout\" error while looking up an order. Which error propagation strategy best enables the coordinator to make intelligent recovery decisions?",
      opts:["Return structured error context: the failure type (\"transient\"), the query attempted, any partial results, and alternatives such as a cache lookup","Retry the lookup three times inside the subagent, then surface only a generic \"lookup unavailable\" status to the coordinator if every one of those attempts still fails","Return an empty order list marked as a successful result so the coordinator's workflow can proceed without special error handling","Terminate the whole support workflow on the timeout and ask the customer to try their request again in a few minutes"],
      answer:0,
      exp:"<strong>結構化的錯誤 context</strong> 讓 coordinator 能做出智能的恢復決策——判斷是否重試、嘗試替代方案，還是帶著部分結果繼續。B 的通用狀態隱藏了有價值的 context；C 將存取失敗偽裝成成功的空結果，阻止了任何恢復；D 因單一失敗就終止整個工作流程是不必要的。"
    },
    {
      q:"You have 18 available MCP tools covering customer lookup, order management, refund processing, shipping tracking, loyalty points, promotional codes, and account management. The agent frequently calls the wrong tool. What architectural change would most improve tool selection reliability?",
      opts:["Split the 18 tools across role-scoped subagents of 4-5 tools each, fronted by a coordinator that routes each request to the right specialist","Keep a single agent but rewrite all 18 tool descriptions with explicit \"use when\" guidance so the model disambiguates them more reliably","Keep a single agent but set <code>tool_choice: \"any\"</code> so it always commits to a tool instead of stalling or mis-selecting during planning","Add a classifier that pre-selects the most likely tool before the agent runs, shrinking its effective choice set on every turn"],
      answer:0,
      exp:"給 agent 太多 tools（18 個而非 4-5 個）<strong>增加決策複雜度，降低 tool selection 可靠性</strong>。最有效的架構解決方案是限制每個 agent 只能存取其角色所需的 tools，通過 coordinator 將不同類型的請求路由到專門的 subagents。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：改寫描述有幫助，但對 18 個工具仍治標，決策複雜度的根因是工具數量太多。C 錯在哪：<code>tool_choice: \"any\"</code> 只保證一定呼叫某個工具，不改善「從 18 個裡選對」的難度。D 錯在哪：加分類器預選工具是繞過問題的額外層，沒從根本縮減每個 agent 的工具數。"
    },
    {
      q:"After a long multi-issue conversation, the agent starts losing track of specific details mentioned early—like exact dollar amounts the customer quoted or specific dates mentioned. What is the most effective solution?",
      opts:["Extract transactional facts — amounts, dates, order numbers, expectations — into a persistent \"case facts\" block injected into every prompt","Switch to a model with a larger context window so the entire conversation history always fits without ever needing to drop early details","Summarize the conversation after every five turns to keep the running context compact and well within the model's limits","Store the full conversation in a database and retrieve relevant details on demand whenever the agent needs an earlier fact"],
      answer:0,
      exp:"<strong>Progressive summarization 的風險</strong>：壓縮數字值、百分比、日期和客戶陳述的期望為模糊的摘要。解決方案是將交易性事實（金額、日期、訂單號、狀態）提取到持久的「<strong>case facts</strong>」區塊，在每個 prompt 中包含此區塊，獨立於摘要的對話歷史，確保關鍵數據不會在摘要過程中丟失。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：換更大的 context window 只是延後問題，長對話仍會稀釋早期的精確數字，且沒解決摘要壓縮的根本機制。C 錯在哪：每 5 turns 摘要正是會把精確金額、日期壓成模糊描述的元兇。D 錯在哪：存進資料庫再按需取回增加了複雜度與往返延遲，case facts 區塊更直接可靠。"
    },
    {
      q:"Your <code>get_customer</code> tool returns a 45-field record, but the agent typically only needs 5-6 fields for most support operations. As conversations grow longer, you notice performance degradation. What is the best approach?",
      opts:["Trim the tool's output to the handful of fields support actually uses before the result is appended to the conversation context","Instruct the agent in the system prompt to ignore the fields it does not need from the 45-field <code>get_customer</code> response","Add a separate lightweight <code>get_customer_summary</code> tool that returns only the common fields for routine lookups","Keep returning the full record but run <code>/compact</code> periodically to shrink the context once it grows too large"],
      answer:0,
      exp:"Tool 結果在 context 中積累，消耗與其相關性<strong>不成比例的 tokens</strong>（每次查詢 40+ 個欄位，但只有 5 個相關）。在結果加入 context 之前進行裁剪，可以防止這種積累。B 依賴模型忽略信息，但這些信息仍然佔用 context 空間；C 錯在哪：另開一個 <code>get_customer_summary</code> 工具可行，但需維護兩個工具且呼叫端要記得選對，在回傳前裁剪更簡單通用；D 解決症狀而非根本原因。"
    },
    {
      q:"A customer messages: \"I'm really frustrated. I've tried to resolve this billing issue three times and nobody has helped. I want to speak to a human representative right now.\" What should the agent do?",
      opts:["Escalate immediately with <code>escalate_to_human</code>, honoring the explicit request before any further investigation of the billing issue","Acknowledge the customer's frustration, then investigate and try to resolve the billing issue yourself before deciding whether to escalate","Make one resolution attempt first, and escalate only if the customer repeats the demand for a human after that attempt fails","Run sentiment analysis on the message and escalate only if the measured frustration level crosses a defined threshold"],
      answer:0,
      exp:"當客戶<strong>明確要求與人工客服溝通時，應立即遵從</strong>，不需要先嘗試調查或解決問題。明確的客戶要求是最高優先級的升級觸發器。B 和 C 都是在客戶已明確要求人工服務後仍試圖自行解決；D 將情緒分析作為代理指標是不可靠的。"
    },
    {

{

      opts:["The error response can't distinguish an access failure (a rate limit needing a retry) from a valid empty result with no matching content","The coordinator simply needs smarter logic to interpret the ambiguous error messages coming back from its subagents","The web search subagent should automatically retry several times on its own before it ever returns any error at all","The status field should carry HTTP codes such as 429 for rate limits, instead of returning the same generic \"error\" string for every failure"],
      answer:0,
      exp:"錯誤報告必須<strong>區分訪問失敗（超時、速率限制需要重試決策）和有效的空結果（成功的查詢但沒有匹配內容）</strong>。當兩者都返回類似的「無結果」消息時，coordinator 無法做出適當的恢復決策。結構化的錯誤 context 應該清楚地表明失敗類型。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：要 coordinator 去猜模糊訊息是治標，根因在於回應本身沒區分失敗類型。C 錯在哪：自動重試對速率限制有點用，但不解決「空結果與存取失敗無法區分」的核心問題。D 錯在哪：用 HTTP 碼只是一種實作，關鍵是語意上要分清兩類，光換碼不夠。"
    },
    {
      q:"A team member suggests that subagents which find no results should silently return empty results rather than propagating errors—this way, the coordinator can always continue. What is the risk of this approach?",
      opts:["Silently suppressing errors stops the coordinator distinguishing access failures from genuine absence, hiding coverage gaps in the research","Empty result objects are simply more efficient than error objects, because they carry far less overhead in the pipeline","This is perfectly acceptable for non-critical research, though it should never be used for business-critical analysis where completeness truly matters","The coordinator will look like it succeeded every time, since no errors ever appear anywhere in the pipeline at all"],
      answer:0,
      exp:"<strong>靜默地將錯誤返回為空結果</strong>（如 API 超時偽裝成空結果）是 anti-pattern，讓 coordinator 無法區分訪問失敗和真正沒有信息。這可能導致研究報告遺漏重要信息，同時又呈現出完整性的外表。synthesis 輸出應該帶有<strong>覆蓋率注釋</strong>，指出哪些主題領域因來源不可用而存在缺口。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：效率不是重點，把錯誤靜默成空結果丟失的是恢復決策所需的資訊。C 錯在哪：就算是非關鍵研究，無法區分「沒找到」與「取不到」仍會默默產出有缺口的報告。D 錯在哪：「看起來成功」正是危險所在——它掩蓋了未被偵測到的覆蓋缺口。"
    },
    {
      q:"Two subagents find conflicting EV market share statistics: web search found \"35% market share in Q4 2023\" (Industry Report A), document analysis found \"28% market share in Q4 2023\" (Government Statistics B). How should the synthesis agent handle this conflict?",
      opts:["Include both values with their source attributions and annotate the conflict explicitly, so the discrepancy is preserved rather than hidden","Select the more authoritative source — the government statistics — and report only that single figure in the output, discarding the conflicting one","Average the two figures together to produce one consensus market-share estimate for the final report","Flag the conflict to the coordinator and pause synthesis until the coordinator decides which value should be used"],
      answer:0,
      exp:"來自可信來源的衝突統計數據應通過<strong>來源歸因注釋衝突</strong>，而不是任意選擇一個值。document analysis 應完成時帶有包含且明確注釋的衝突值，讓 coordinator 在傳遞給 synthesis 之前決定如何調解。報告應<strong>區分有充分依據的發現和有爭議的發現</strong>。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：逕自選「較權威」來源會丟棄另一個可信來源的資訊，掩蓋真實分歧。C 錯在哪：把衝突數字平均，會製造一個兩邊來源都不支持的假數字。D 錯在哪：暫停 synthesis 等 coordinator 裁決會卡住流程，正解是保留並注釋衝突再往下傳。"
    },
    {
      q:"Your research reports are missing the publication dates of sources, causing the synthesis agent to treat data from 2018 and 2024 as equivalent—leading to misleading \"contradiction\" flags when data has simply been updated over time. What is the fix?",
      opts:["Require subagents to put publication or collection dates in their structured output, so downstream agents read temporal gaps correctly","Add a post-processing step that goes out and fetches publication dates for every cited source after the synthesis step has already finished","Tell the synthesis agent to go and search for publication dates whenever two of its sources appear to contradict","Use only sources published within the last twelve months so that this kind of temporal confusion never arises at all"],
      answer:0,
      exp:"要求 subagents 在<strong>結構化輸出中包含出版或數據收集日期</strong>，可以防止時間差異被誤解為矛盾。當 synthesis agent 知道一個數字來自 2018 年而另一個來自 2024 年時，它可以正確地將差異解釋為時間變化而不是衝突。這些 metadata 必須在早期 stages 就包含在結構化輸出中。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：synthesis 完成後才補日期已經太遲，誤判的「矛盾」在合成當下就已發生。C 錯在哪：讓 synthesis 在發現矛盾時才去查日期是被動補救，且增加額外查詢與不確定性。D 錯在哪：只用近 12 個月來源會丟棄有價值的歷史資料，也不是處理時間維度的正解。"
    },
    {
      q:"For research on \"quantum computing applications in finance,\" the coordinator creates 3 subagents: one for \"quantum computing,\" one for \"finance technology,\" and one for \"risk modeling.\" The report comprehensively covers all three areas but fails to address how quantum computing specifically applies to finance. What design change would fix this?",
      opts:["Write coordinator prompts that specify goals and quality criteria (\"find applications banks are actually testing\"), not keyword subtopics","Add a fourth subagent that focuses specifically on the intersection topic of \"quantum computing in finance\" all by itself","Have the synthesis agent spot the gaps after results arrive and then request additional targeted research passes","Assign each subagent to a specific financial sector — banking, insurance, investment — instead of to a broad subject-matter topic area"],
      answer:0,
      exp:"Coordinator prompts 應該<strong>指定研究目標和質量標準</strong>，而不是逐步的程序性指令或關鍵詞。目標導向的提示（「找到金融機構正在採用的具體量子計算應用」）比關鍵詞主題分配更能讓 subagents 覆蓋交叉點，同時使 subagents 能夠自適應。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：再加一個子代理只是補一塊拼圖，根因——關鍵詞式分解——仍在，其他交叉點照樣漏。C 錯在哪：事後讓 synthesis 找缺口是補救，不如一開始就用目標導向 prompt 從源頭涵蓋。D 錯在哪：改按金融部門分派仍是另一種關鍵詞切法，未必對準「量子如何應用於金融」這個交叉目標。"
    },
    {
      q:"After the coordinator receives all subagent results, it synthesizes a first draft. The draft is missing analysis on cryptocurrency regulation and climate finance—two areas that should be covered. What pattern should the coordinator implement to catch and address these gaps?",
      opts:["Have the coordinator run an iterative refinement loop: detect gaps, re-delegate targeted queries, and re-run synthesis until coverage is sufficient","Have the synthesis subagent add a \"coverage assessment\" section listing all the topics it could find no information on, for the coordinator to act on later","Add more subagents at the very start so the initial synthesis pass achieves comprehensive coverage from the outset","Have the report generation subagent insert placeholder sections for any expected topics that synthesis left uncovered"],
      answer:0,
      exp:"<strong>迭代細化循環（iterative refinement loop）</strong>：coordinator 評估 synthesis 輸出的缺口、用有針對性的 queries 重新委託給 search 和 analysis subagents、然後重新調用 synthesis 直到覆蓋範圍足夠。這確保了全面的覆蓋，而不是在初始 pass 後就接受不完整的輸出。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：列出缺口清單只是標記問題，並沒有實際回去補齊那些缺漏的研究。C 錯在哪：一開始多加 subagents 無法保證涵蓋所有面向，缺口仍可能在合成後才浮現。D 錯在哪：插入佔位章節只是留白，沒有觸發補充研究，報告依舊不完整。"
    }
  ]

{
  id:4,
  title:"Scenario 4: Developer Productivity with Claude",
  desc:"You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses the built-in tools (Read, Write, Edit, Bash, Grep, Glob) and integrates with MCP servers.",
  domains:"Primary domains: Tool Design & MCP Integration · Claude Code Configuration & Workflows · Agentic Architecture & Orchestration",
  questions:[
    {
      q:"A developer asks the agent to \"find all places in the codebase that use the <code>UserAuthentication</code> class.\" Which built-in tool should the agent use first?",
      opts:["Grep — to search file contents for the string \"UserAuthentication\" across the whole codebase","Glob — to find every file whose name matches the pattern <code>**/*Authentication*</code> in the tree","Read — to open each source file in turn and check whether it references <code>UserAuthentication</code>","Bash — to run a <code>find</code> piped into <code>grep</code> that searches for the class name across files"],
      answer:0,
      exp:"<strong>Grep 用於內容搜索</strong>（在文件內容中搜索函數名稱、錯誤消息或導入語句等模式）。在跨 codebase 搜索類引用時，Grep 是正確的選擇。<strong>Glob 用於文件路徑模式匹配</strong>（按名稱或擴展名模式查找文件），不適合內容搜索。讀取每個文件（C）效率低下。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：Glob 按檔名模式找檔，但類別引用可能出現在任何檔名的檔案中，要的是內容搜尋。C 錯在哪：逐一 Read 每個檔再檢查，效率極低且浪費 context。D 錯在哪：用 Bash 跑 <code>find|grep</code> 雖能達到目的，但 Grep 是內建、更直接安全的內容搜尋工具，不需繞道 shell。"
    },
    {
      q:"The agent tries to edit a frequently-used boilerplate comment block that appears identically in 15 files. The Edit tool returns an error because the text is not unique. What should the agent do?",
      opts:["Use Read to load the full file, then use Write to save the version with the specific change needed in that one file","Use Grep to find a unique block of surrounding context and pass that as the anchor text into the Edit tool call","Use Bash with <code>sed</code> to run a single global find-and-replace across all of the affected files at once","Use the Edit tool with <code>replace_all: true</code> to update every instance of the block simultaneously"],
      answer:0,
      exp:"<strong>當 Edit 因為非唯一文本匹配而失敗時，使用 Read + Write 作為備用方案</strong>可以進行可靠的文件修改。Read 加載完整的文件內容，然後 Write 保存帶有所需更改的修改版本。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：用周圍 context 當 anchor 偶爾可行，但各檔上下文可能同樣不唯一或多變，不如 Read+Write 可靠。C 錯在哪：<code>sed</code> 全域取代會一次改掉全部 15 個檔，但題目要的是針對單一檔做特定修改。D 錯在哪：<code>replace_all: true</code> 只在同檔內取代所有相同文本，無法處理跨 15 個檔的情境，還可能誤改不該改的。"
    },
    {
      q:"A developer asks the agent to understand a large, unfamiliar codebase and trace how a payment is processed end-to-end. What is the most effective approach?",
      opts:["Start with Grep to find entry points like the \"processPayment\" function, then use Read to follow imports and trace the flow incrementally","Use Read to load every source file upfront into the context window so that all of the information is present at once for the model to reason over","Use Glob to find all the files that might relate to payments, then Read all of them at the same time together","Use Bash to actually run the application and trace its execution through verbose debug logging output"],
      answer:0,
      exp:"<strong>增量地構建 codebase 理解</strong>：從 Grep 找到入口點，然後使用 Read 追蹤導入和執行流程，而不是一開始就讀取所有文件。這種方法避免了 context window 被不相關的文件淹沒，與開發者手動探索 codebase 的方式相似。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：一次把所有檔案讀進 context 會被無關內容淹沒，浪費 token 又稀釋注意力。C 錯在哪：Glob 找出再全部 Read，本質上仍是一次性載入大量檔案，沒有增量聚焦。D 錯在哪：跑起來看 debug log 適合動態行為除錯，但要追蹤端到端流程，靜態追讀程式碼更直接。"
    },
    {
      q:"Your team wants to add a GitHub Issues MCP server that all developers share, and separately, you want to add an experimental Jira MCP server that only you are testing. Where should each be configured?",
      opts:["GitHub Issues in project-scoped <code>.mcp.json</code> (shared via version control); Jira in user-scoped <code>~/.claude.json</code> (personal)","Both in the project-scoped <code>.mcp.json</code>, since all of the team's tools really should be managed centrally","Both in <code>~/.claude.json</code>, since MCP servers are specific to each individual developer's own local environment and setup","GitHub Issues in <code>.claude/settings.json</code> and the experimental Jira server in user-scoped <code>~/.claude.json</code>"],
      answer:0,
      exp:"<strong>MCP server 的範圍</strong>：project-level (<code>.mcp.json</code>) 用於共享的<strong>團隊工具</strong>，通過版本控制共享；user-level (<code>~/.claude.json</code>) 用於<strong>個人/實驗性的 servers</strong>。GitHub Issues server 是整個團隊共享的，應在 <code>.mcp.json</code> 中；Jira server 只有你在測試，應在 <code>~/.claude.json</code> 中。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：把只有你在測試的實驗性 Jira server 放進共享的 <code>.mcp.json</code> 會強加給全團隊。C 錯在哪：GitHub Issues 是團隊共用的，放個人 <code>~/.claude.json</code> 無法散佈給其他人。D 錯在哪：MCP server 不是配置在 <code>.claude/settings.json</code>，共享的 server 應放 <code>.mcp.json</code>。"
    },
    {
      q:"Your team's <code>.mcp.json</code> needs to include API credentials for the GitHub MCP server. How should you handle the credentials?",
      opts:["Use environment-variable expansion: set the token as <code>${GITHUB_TOKEN}</code> in <code>.mcp.json</code> and have each developer export it locally","Store the credentials directly inside <code>.mcp.json</code> and add that file to <code>.gitignore</code> so it never gets committed","Create a separate <code>.mcp.secrets.json</code> file for the credentials and reference it from the main <code>.mcp.json</code> file","Generate a single read-only token and hardcode it straight into <code>.mcp.json</code>, since its permissions are limited to reads anyway"],
      answer:0,
      exp:"<strong><code>.mcp.json</code> 中的環境變量擴展</strong>（例如 <code>${GITHUB_TOKEN}</code>）允許在不提交密鑰的情況下進行憑據管理。每個開發者在本地環境中設置 <code>GITHUB_TOKEN</code>，<code>.mcp.json</code> 可以安全地被版本控制。將憑據存儲在 <code>.mcp.json</code> 即使加入 <code>.gitignore</code> 也有風險；硬編碼任何 token 都是不良實踐。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：把密鑰寫進 <code>.mcp.json</code> 再靠 <code>.gitignore</code>，一旦失誤被加入就外洩，且該檔無法版本控制。C 錯在哪：另開 secrets 檔仍是把明文密鑰存在磁碟，還需額外機制管理與散佈。D 錯在哪：唯讀 token 仍是憑證，硬編碼進版本控制就是洩漏，權限有限不代表可公開。"
    },
    {
      q:"Your team uses a Jira MCP server for ticket lookup, but the agent almost always uses its built-in Grep tool to search for ticket information in local README files instead—even when the user is clearly asking about current ticket status. What is the most likely cause?",
      opts:["The Jira tool's description is too thin to outcompete built-in tools like Grep; enriching that description is what fixes the misrouting","The Jira MCP server is responding too slowly, so the agent learns to prefer the faster built-in tools rather than waiting on its responses","The agent's system prompt contains keywords that create an unintended association with the built-in Grep tool","MCP tools are inherently ranked lower than built-in tools during Claude's tool-selection process by default"],
      answer:0,
      exp:"<strong>增強 MCP tool descriptions</strong> 來詳細解釋其功能和輸出，可以防止 agent 偏好內建工具（如 Grep）而非更強大的 MCP tools。如果 Jira MCP tool 的描述很簡單，而 Grep 有詳細的使用說明，agent 就會傾向選擇它更了解的 Grep。<strong>描述是 LLM tool selection 的主要機制</strong>。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：題目沒有任何延遲徵兆，agent 偏好 Grep 是因為更了解它的描述，而非 Jira 回應慢。C 錯在哪：問題在 Jira 工具描述太薄，不是 system prompt 的關鍵字關聯。D 錯在哪：MCP 工具與內建工具沒有先天的優先順序之分，選擇取決於描述品質。"
    },
    {
      q:"Your company already uses Jira for issue tracking. You need to add Jira integration to your developer productivity agent. Which approach should you take?",
      opts:["Use an existing community Jira MCP server rather than building your own, unless you have team-specific workflows it can't support","Build a custom Jira MCP server from scratch so that it precisely meets your own security and feature requirements","Use Claude's built-in web fetching capabilities to pull Jira data directly through its published REST API endpoints on each request","Create your own custom MCP tools wrapping the Jira REST API to get tighter control over the whole integration"],
      answer:0,
      exp:"對於標準集成（例如 Jira），應該<strong>優先使用現有的社區 MCP servers</strong>，而不是自定義實現。社區 MCP servers 已經過測試，有完整的功能，並由社區維護。<strong>自定義 servers 應保留給需要特定工作流程</strong>的情況，這些情況無法被現有社區 servers 很好地服務。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：標準整合卻自建 server 是重造輪子，社區版已測試完整；除非有特殊工作流程才需自建。C 錯在哪：用 web fetch 直打 REST API 缺少 MCP 的工具結構與認證管理，零散又難維護。D 錯在哪：自寫 MCP 工具包裝 REST 仍是自建整合，對 Jira 這種標準需求並不必要。"
    },
    {
      q:"You have two tools: <code>analyze_code</code> and <code>analyze_security</code>. Both have identical descriptions: \"Analyzes code for issues.\" The agent randomly picks between them for security-related requests. What is the most effective fix?",
      opts:["Rewrite the names and descriptions: <code>analyze_code</code> for general quality, <code>analyze_security</code> for vulnerabilities, with examples and boundaries","Merge both tools into a single <code>analyze</code> tool that takes a <code>type</code> parameter of either \"quality\" or \"security\" to select its behavior","Add few-shot examples to the system prompt that show security requests being routed to <code>analyze_security</code>","Rename <code>analyze_security</code> to <code>scan_for_vulnerabilities</code> so the distinction is obvious from the name alone"],
      answer:0,
      exp:"<strong>模糊或重疊的 tool descriptions 會導致 misrouting</strong>。重寫 descriptions 以清楚地區分每個 tool 的目的、預期輸入、輸出和何時使用它（包括輸入格式、邊界解釋），是解決 tool 混淆最有效的方法。只重命名（D）沒有提供足夠的 context；few-shot（C）不能解決根本原因。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：合併成單一 <code>analyze</code> 工具加 type 參數可行，但沒解決描述模糊的根因，模型仍可能選錯 type。C 錯在哪：few-shot 範例治標，沒修正兩個工具描述相同這個根本問題。D 錯在哪：只改名而不重寫描述，模型仍缺乏分辨用途、輸入與邊界的 context。"
    },
    {
      q:"You're building a code analysis agent that should always call a specific <code>run_analysis</code> tool as its first action, before calling any other tools. How do you implement this requirement?",

      answer:0,
      exp:"<strong>強制特定工具選擇</strong>（<code>tool_choice: {\"type\": \"tool\", \"name\": \"run_analysis\"}</code>）確保指定的工具首先被調用，然後在後續 turns 中以 <code>tool_choice: \"auto\"</code> 處理後續步驟。這提供了確定性保障。<code>tool_choice: \"any\"</code>（B）只保證調用某個工具但不指定哪個；system prompt（C）是概率性的；把工具排在陣列最前（D）只是弱偏好，無法「保證」第一個就呼叫它。"

    {
      q:"Your code generation agent sometimes returns a conversational response (\"I can help you with that! Let me generate the boilerplate code...\") without actually generating any code, especially for ambiguous requests. You want to guarantee the agent always generates structured output rather than conversational responses. How?",
      opts:["Set <code>tool_choice: \"any\"</code> to guarantee the model calls a tool instead of returning conversational text","Add to the system prompt: \"Always generate code directly, with no conversational preamble before it\"","Set <code>tool_choice: \"auto\"</code> and add few-shot examples that show direct, immediate code generation","Use a temperature of 0 to make the model deterministic and more likely to follow the output format"],
      answer:0,
      exp:"設定 <strong><code>tool_choice: \"any\"</code></strong> 可以保證模型調用工具而不是返回對話文本，提供確定性保障，確保 agent 總是生成結構化輸出。這比依賴模型遵循 prompt 指令的概率性合規更可靠。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：靠 prompt 指令「直接產碼」是概率性的，模型仍可能回一段閒聊文字。C 錯在哪：<code>auto</code> 允許模型選擇不呼叫工具，加 few-shot 也無法「保證」每次都產出結構化結果。D 錯在哪：temperature 影響的是隨機性，與是否呼叫工具無關。"

    {
      q:"A developer wants to understand a monorepo with 50+ packages before deciding which packages to modify for a new feature. The initial exploration phase would require reading hundreds of files and produce thousands of lines of output. What is the best approach?",
      opts:["Use the Explore subagent for the verbose discovery phase; it isolates the huge output and returns just a summary to the main agent","Run <code>/compact</code> before starting the exploration so that as much context space as possible is freed up first","Read every file in the monorepo first to get complete information, and only then begin planning the feature","Use plan mode to explore the entire monorepo, since plan mode is built specifically for this kind of large-scale codebase exploration"],

      exp:"對於在多階段任務的發現階段可能耗盡 context window 的情況，使用 <strong>Explore subagent</strong> 進行冗長的發現階段，可以防止 context window 耗盡，同時向主 agent 返回摘要。<strong>subagent 委託隔離了冗長的探索輸出</strong>，同時主 agent 保持高層次的協調理解。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：<code>/compact</code> 只壓縮現有 context，無法隔離即將產生的大量探索輸出。C 錯在哪：先讀完整個 monorepo 正是會撐爆 context 的做法。D 錯在哪：plan mode 用於規劃變更方案，不是為了隔離冗長探索輸出，後者該交給 Explore subagent。"
    },
    {
      q:"You're creating a <code>/analyze-dependencies</code> skill that requires a target package name as input. When developers invoke it without providing the package name, you want the skill to prompt them for it. What frontmatter option achieves this?",
      opts:["<code>argument-hint: \"package name to analyze\"</code> — prompts developers for the required parameter when they invoke the skill bare","<code>required-args: [\"package_name\"]</code> — enforces that the skill simply cannot run at all without the argument present","<code>context: fork</code> — running the skill in isolation means it will automatically request any missing inputs it needs","<code>allowed-tools: [\"AskUser\"]</code> — enables the skill to call out and ask the developer directly for its inputs"],
      answer:0,
      exp:"<strong><code>argument-hint</code></strong> frontmatter 選項在開發者沒有帶參數調用 skill 時，提示他們輸入所需的參數。這在 SKILL.md 中作為用戶界面提示，引導開發者在不理解如何調用 skill 時提供必要的輸入。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：<code>required-args</code> 不是實際存在的 frontmatter 欄位。C 錯在哪：<code>context: fork</code> 控制的是隔離執行，不會自動向使用者索取缺少的參數。D 錯在哪：<code>allowed-tools</code> 列的是可用工具，<code>AskUser</code> 並非用來提示缺漏參數的機制。"
    },
    {
      q:"Your codebase has grown large and your CLAUDE.md has become hard to maintain. You want to better organize your Claude Code configuration. What is the recommended approach?",
      opts:["Create topic-based <code>.claude/rules/</code> files (<code>testing.md</code>, <code>security.md</code>) with YAML frontmatter setting which file patterns each one applies to","Use multiple CLAUDE.md files spread across different directories, each one covering that directory's own conventions on its own","Keep a single root CLAUDE.md, but organize it with clearly labeled H2 headers for each separate topic area","Move all of the configuration into <code>.claude/settings.json</code>, which supports structured configuration formats"],
      answer:0,
      exp:"<strong><code>.claude/rules/</code> 目錄</strong>允許將主題特定的規則文件組織成獨立文件，作為單一大型 CLAUDE.md 的替代方案。結合 YAML frontmatter 路徑字段，這些規則只在相關文件被編輯時加載，<strong>減少無關 context 和 token 消耗</strong>，比單一大型 CLAUDE.md 更容易維護。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：子目錄 CLAUDE.md 無法依檔案類型條件載入，跨目錄的共通慣例也難涵蓋。C 錯在哪：單一大檔即使有 H2 標題，仍會全部載入、無關規則照樣占 context。D 錯在哪：<code>.claude/settings.json</code> 是設定檔，不是放編碼慣例與規則的地方。"
    },
    {
      q:"During a long legacy codebase investigation, your main coordinator agent's responses become less precise—referencing \"typical Java patterns\" rather than the specific legacy classes it discovered 45 minutes ago. How should you redesign the agent?",
      opts:["Spawn subagents for specific questions like \"map all service interfaces\" while the main agent coordinates, and have agents keep scratchpad files","Use <code>/compact</code> much more frequently so as to keep freeing up context for the agent's new discoveries","Reduce the overall scope of the investigation so the main agent's context stays small and manageable","Switch to a model with a larger context window so it can hold the entire extended investigation, including every legacy class it discovered, at once"],
      answer:0,
      exp:"在擴展 session 中的 context 降解可以通過兩種互補方式解決：(1) <strong>生成 subagents 調查特定問題</strong>，同時主 agent 保持高層次的協調；(2) <strong>讓 agents 維護 scratchpad 文件</strong>記錄關鍵發現，在後續問題中引用它們。這樣就不依賴 context window 來記住早期發現。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：<code>/compact</code> 壓縮歷史會把早期發現的具體類別細節一併壓糊，正是降解的來源。C 錯在哪：縮小調查範圍是犧牲任務目標來遷就 context，並非解法。D 錯在哪：換更大模型只延後降解，長 session 仍會退回引用「典型 Java 模式」。"
    },
    {
      q:"You're tasked with \"adding comprehensive test coverage to a legacy codebase with no existing tests.\" How should you decompose this task?",
      opts:["Map the codebase first, identify the high-impact, high-risk areas, then build a prioritized test plan that adapts as hidden complexity surfaces","Start writing tests right away for the most recently modified files, since those are the ones likeliest to be hiding the newest bugs and regressions","Use a fixed pipeline: list all files, generate tests alphabetically, run them, and then go back and fix the failures","Enter plan mode with a complete specification of every single test that's needed before any test code gets written"],

      exp:"開放式任務（如「為 legacy codebase 添加全面測試」）需要<strong>動態自適應的分解</strong>：首先映射結構、識別高影響力領域，然後創建一個隨著依賴關係和隱藏複雜性被發現而適應的優先計劃。固定的順序 pipeline（C）對開放式調查任務不靈活；等待完整規範（D）在探索之前是不可能的。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：先測最近改動的檔是基於「最近＝最可能有 bug」的臆測，對「全面覆蓋」這個目標並不對焦。C 錯在哪：固定的字母順序 pipeline 無法因應探索中才發現的依賴與隱藏複雜度。D 錯在哪：在尚未探索 legacy code 前就要求完整測試規範，根本無從寫起。"
    },
    {

{
  id:5,
  title:"Scenario 5: Claude Code for Continuous Integration",
  desc:"You are integrating Claude Code into your CI/CD pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.",
  domains:"Primary domains: Claude Code Configuration & Workflows · Prompt Engineering & Structured Output",
  questions:[
    {
      q:"Your CI pipeline script runs <code>claude \"Review this pull request for security vulnerabilities\"</code> but the job hangs indefinitely, waiting for interactive input. What is the correct way to run Claude Code in an automated CI pipeline?",
      opts:["Add the <code>-p</code> flag: <code>claude -p \"Review this pull request...\"</code> to run in non-interactive print mode","Set the environment variable <code>CLAUDE_NONINTERACTIVE=true</code> before running the command in the pipeline","Redirect stdin from nothing: <code>claude \"Review this pull request\" < /dev/null</code> so it can never block","Add the <code>--ci</code> flag: <code>claude --ci \"Review this pull request...\"</code> to switch it into CI mode"],
      answer:0,
      exp:"<strong><code>-p</code>（或 <code>--print</code>）flag</strong> 是在自動化 pipeline 中以非交互模式運行 Claude Code 的正確方式。它處理 prompt，將結果輸出到 stdout，然後退出而不等待用戶輸入——這正是 CI/CD pipeline 所需要的。其他選項引用了不存在的功能（<code>CLAUDE_NONINTERACTIVE</code>、<code>--ci</code> flag）。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：<code>CLAUDE_NONINTERACTIVE</code> 這個環境變數並不存在。C 錯在哪：把 stdin 導向 <code>/dev/null</code> 不會讓 Claude 進入非互動模式，它仍以互動模式啟動，可能卡住或行為異常。D 錯在哪：<code>--ci</code> 不是真實存在的 flag。"
    },
    {
      q:"You want your CI pipeline to post Claude Code review findings as inline PR comments. The findings need to be machine-parseable with file path, line number, severity, and description fields. How should you invoke Claude Code?",
      opts:["Use <code>--output-format json</code> together with <code>--json-schema</code> to force JSON that matches a predefined schema with the required fields","Use <code>--output-format json</code>, which on its own already produces structured findings carrying all of the standard fields","Post-process Claude's plain text output with a regex parser that extracts the findings out into JSON afterward","Skip the CLI and call the Claude API directly, since structured output requirements in CI are better handled there"],
      answer:0,
      exp:"在 CI context 中，<strong><code>--output-format json</code> 結合 <code>--json-schema</code></strong> 可以強制結構化輸出，精確匹配預定義的 schema，包含所需欄位（文件路徑、行號、嚴重性、描述）。這產生機器可解析的結構化發現，可以自動化地發布為內聯 PR 評論。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：單用 <code>--output-format json</code> 雖給結構化輸出，但不保證符合你預定義的特定 schema 與欄位。C 錯在哪：用 regex 解析純文字脆弱易碎，格式一變就失敗，違背要可靠機器解析的目的。D 錯在哪：改用 API 雖可行，但題目要的是在 CI 用 Claude Code CLI，而 CLI 本就支援 schema 強制。"
    },
    {
      q:"You're using the same Claude session that wrote the code to also review it before merging. Reviews are catching fewer issues than expected. What is the fundamental problem?",
      opts:["A model keeps the reasoning context from generation and rarely questions its own choices; an independent reviewer without that context catches more","The same model just cannot act as both the code generator and the reviewer at once, because of inherent role confusion between them","The context window fills up after code generation, leaving too little remaining capacity for a genuinely thorough review pass","Add self-critique instructions like \"now review the code you just wrote as a skeptical senior engineer\" to offset the generation bias"],
      answer:0,
      exp:"<strong>Self-review 的局限性</strong>：模型保留了生成時的推理 context，使它不太可能在同一 session 中質疑自己的決策。<strong>沒有生成者先前推理 context 的獨立審查實例</strong>在捕捉微妙問題方面更有效，優於 self-review 指令或擴展思考。這是 multi-instance review 架構的基礎。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：同一模型其實可以分飾兩角，問題不是「角色混淆」，而是它保留了生成時的推理偏向。C 錯在哪：審查抓不到問題的根因是生成偏向，不是 context 容量不足。D 錯在哪：自我批評指令或擴展思考都仍在同一 session 內，受生成推理 context 影響，效果不如獨立實例。"
    },
    {
      q:"After a developer addresses review comments and pushes new commits, your CI pipeline runs a fresh review that re-flags all the issues from the previous review—even those already fixed—creating noise and frustrating developers. How should you fix this?",
      opts:["Include the prior review's findings in context when re-reviewing, and tell Claude to report only new or still-unaddressed issues","Clear out all of the previous review comments before running each new review, just to avoid any duplicates appearing","Track which issues were marked resolved in your issue tracker and filter exactly those out of every subsequent new review","Only run the review over the files that changed between the first review's commit and the current commit being reviewed"],
      answer:0,
      exp:"在新 commits 後重新運行審查時，<strong>在 context 中包含先前的審查發現</strong>，並指示 Claude <strong>只報告新問題或仍未解決的問題</strong>，可以避免重複評論。這確保了每次審查都基於先前的反饋進行構建，而不是重新開始並重新標記已解決的問題。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：清掉舊評論只是隱藏重複，新審查仍會重新標記已修好的問題。C 錯在哪：靠 issue tracker 的「已解決」標記需人工維護，且常與實際程式碼脫節。D 錯在哪：只審變動檔會漏掉新 commit 對其他檔的連帶影響，也沒解決「重標已修問題」。"
    },
    {
      q:"Your CI review prompts instruct Claude to \"be conservative and only flag high-confidence issues.\" Production data shows 40% false positives in the \"unused variables\" category, causing developers to start ignoring all review comments. What should you do?",
      opts:["Temporarily disable the unused-variables category while you sharpen its criteria (e.g. \"flag only when exported\") to rebuild trust","Raise the confidence-threshold instruction in the prompt to \"only flag the issues you are at least 90% confident are genuine\"","Add more context to the prompt explaining, in general terms, what does and does not count as a high-confidence issue","Run several independent review passes and only flag the issues that show up in at least 2 out of the 3 of them"],
      answer:0,
      exp:"<strong>高假陽性類別會損害對準確類別的信心</strong>。暫時停用高假陽性類別以恢復開發者信任，同時用<strong>明確的標準</strong>（而不是基於信心的過濾）改進這些類別的 prompts，這是正確的策略。「保守」或「高信心」等通用指令無法改善精確度——需要的是具體的分類標準。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：把信心門檻拉到 90% 仍是信心式過濾，模型對錯誤判斷也可能很有信心，精確度不會改善。C 錯在哪：加籠統的「什麼算高信心」說明仍不具體，無法界定該報哪些、跳過哪些。D 錯在哪：跑多次取 2/3 一致只是降噪，若每次都犯同樣的系統性誤判，假陽性照樣通過。"
    },
    {
      q:"You review code for three types of issues: security vulnerabilities, logic bugs, and style violations. Security and logic reviews are accurate, but style reviews have a 60% false positive rate. What is the most targeted fix?",
      opts:["Define explicit style criteria — which issues to report (documented CLAUDE.md conventions) versus skip (mere preferences) — with concrete examples","Remove style review from the CI pipeline altogether, on the grounds that its signal-to-noise ratio is simply too low to be worth anyone's time","Add a confidence filter to the prompt: \"only report a style issue when you are 95% sure that it's a genuine violation\"","Move the style review into a separate CI job that runs much less often, which reduces how much noise it generates per PR"],
      answer:0,
      exp:"為 style reviews 定義<strong>明確的標準</strong>（哪些問題要報告，哪些要跳過）而不是依靠基於信心的過濾，可以最有效地解決假陽性問題。具體的、<strong>基於類別的標準</strong>比「報告高信心問題」更有效：「報告 CLAUDE.md 中記錄的約定違規，跳過未在項目指南中的風格偏好」。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：直接移除整類審查會犧牲真正有價值的風格檢查，因噎廢食。C 錯在哪：「95% 信心」這類信心式過濾無法提升精確度，模型對錯誤判斷也可能很有信心。D 錯在哪：換到較少跑的 job 只是降低出現頻率，假陽性比率本身沒改善。"
    },
    {
      q:"Your CI review system flags issues with three severity levels—Critical, Warning, Info—but reviewers say the classifications are inconsistent: some style issues are marked Critical while serious security issues are marked Info. How do you fix severity classification?",
      opts:["Define explicit severity criteria with 2-3 code examples each: Critical for security, Warning for logic and deprecation, Info for style","Have Claude self-report a confidence score alongside each finding, then map all the high-confidence findings to Critical","Add a separate classification step that re-evaluates the severity of each finding after the initial review has run","Train the reviewers to override the severity levels directly in the PR comment interface to correct any misclassifications after the fact"],
      answer:0,
      exp:"在 review prompt 中為每個嚴重性級別<strong>定義明確的標準，並帶有具體的代碼範例</strong>，可以實現一致的分類。沒有明確標準，模型會不一致地應用標籤。具體範例（Critical = 安全漏洞；Warning = 邏輯問題；Info = 風格）讓模型知道如何對每個發現進行分類。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：信心高低反映的是模型的確定度，與嚴重性無關，高信心的風格問題不該變 Critical。C 錯在哪：再加一個重新分類步驟若仍無明確標準，只是把同樣的不一致再做一次。D 錯在哪：靠人工逐一覆寫嚴重性是事後補救，無法規模化，也沒解決模型分類不一致的根因。"
    },
    {
      q:"Your CI pipeline generates test cases for new code. Despite detailed instructions about the desired format, Claude still produces tests with inconsistent naming conventions, varying assertion styles, and different coverage levels. What technique would most effectively achieve consistency?",
      opts:["Add 2-3 few-shot examples showing complete test functions with the exact naming, assertion style, and coverage that you want","Make the format instructions even more specific by spelling out exact templates for the test-method naming as well","Add the project's existing test files into context so Claude can infer the desired format from those examples","Run a post-processing script that standardizes the test formatting after Claude has already generated the tests"],
      answer:0,
      exp:"<strong>Few-shot 範例是在詳細指令單獨產生不一致結果時，實現一致格式化輸出最有效的技術</strong>。提供 2-3 個目標 few-shot 範例，展示具有確切命名約定、斷言風格和覆蓋模式的完整測試函數，讓模型學習並泛化這個格式。只加入測試文件（C）不如明確的 few-shot 範例有效。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：再怎麼細化文字模板，題目已說明詳細指令仍產生不一致，文字描述正是失效的那一招。D 錯在哪：事後用腳本標準化格式是治標，無法讓模型本身學會生成正確格式。"
    },
    {
      q:"Your CI pipeline generates test cases, but the generated tests frequently duplicate scenarios already covered by the existing test suite. How should you fix this?",
      opts:["Provide the existing test files in context so generation can see what's already covered and avoid suggesting any duplicates","Add deduplication logic that compares each generated test against the existing tests before it is actually added in","Instruct Claude in the system prompt to \"only generate novel tests that are not already present in the codebase\"","Have Claude first list out every existing test scenario, then generate only the new ones in a separate second pass"],
      answer:0,
      exp:"在 context 中<strong>提供現有測試文件</strong>，讓測試生成能夠避免建議已經被測試套件覆蓋的重複場景。這是在 CLAUDE.md 中文檔化並在每個 CI 調用中包含現有測試文件的推薦做法，讓模型能夠看到已有的內容並相應地生成<strong>補充測試</strong>。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：事後去重是在已生成重複測試之後才過濾，浪費生成成本也不夠精準。C 錯在哪：光在 prompt 說「只生成新測試」，模型看不到既有測試就無從判斷何謂重複。D 錯在哪：先列舉再生成是兩段式 hack，仍不如直接提供既有測試檔讓模型一次看清。"
    },
    {
      q:"Your CI system runs: (1) a blocking pre-merge check developers must wait for, and (2) a weekly security audit that generates an overnight report. Your manager suggests using the Message Batches API for both to save 50% on costs. How should you evaluate this?",
      opts:["Use batch processing only for the weekly audit; keep real-time calls for the pre-merge check, since batches can take up to 24 hours","Use batch processing for both — it often finishes faster, and the 50% cost savings justifies any added latency anyway","Keep real-time API calls for both jobs, so as to guarantee a consistent and predictable experience for the developers","Use batch processing for both, with a fallback to real-time whenever a given batch takes longer than ten minutes to run"],
      answer:0,
      exp:"Message Batches API 提供 50% 的成本節省，但<strong>處理窗口最長達 24 小時，沒有保證的延遲 SLA</strong>。這使其不適合開發者在等待結果的阻塞式 pre-merge checks，但非常適合像每週安全審計這樣的隔夜批次工作。批次結果可以使用 <code>custom_id</code> 字段進行關聯。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：對阻塞式 pre-merge check 用 batch，最長 24 小時且無 SLA，開發者會空等。C 錯在哪：兩者都用即時 API，會在隔夜審計上浪費可省的 50% 成本。D 錯在哪：「超過 10 分鐘才 fallback」的混合機制複雜又不可靠，pre-merge 本就該直接用即時。"
    },
    {
      q:"Your team has a 30-hour SLA to complete security scans for compliance documentation. You're using the Message Batches API which has a maximum processing window of 24 hours. How should you structure batch submissions to guarantee the SLA?",
      opts:["Submit batches at intervals no greater than 6 hours (30-hour SLA minus the 24-hour window), so even the last submission still finishes in time","Submit every document as one single batch a full 30 hours before the deadline, on the assumption that it will complete in well under ten hours","Use the synchronous API for the compliance scans, since the SLA requirements make batch processing inappropriate here","Submit in 12-hour intervals, since batches typically complete considerably faster than their maximum processing window anyway"],
      answer:0,
      exp:"<strong>根據 SLA 限制計算批次提交頻率</strong>：SLA（30 小時）減去批次 API 最大處理窗口（24 小時）= 必須在截止日期前至少 <strong>6 小時提交</strong>。提交間隔不超過 6 小時可保證即使是最後一次提交也能在 SLA 窗口內完成。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：單一大批次在截止前 30 小時送出，若它用滿 24 小時窗口仍可能超過 SLA，沒有安全邊際。C 錯在哪：合規掃描量大，全用同步 API 成本高，也未必比規劃好的批次可靠。D 錯在哪：12 小時間隔賭「通常更快」，最後一批仍可能用滿 24 小時而破 SLA。"
    },
    {
      q:"Your team generates code with Claude Code and reviews it in the same Claude Code session. Reviews consistently miss subtle logic errors that human reviewers later find. What architectural change would most improve review effectiveness?",
      opts:["Use a second, independent Claude Code instance to review the code without giving it the generation session's reasoning context","Add a <code>/review</code> command whose specific instructions tell Claude to be considerably more critical and more thorough","Turn on extended thinking mode for the review step so that the model is able to reason more deeply about the code","Add few-shot examples of logic errors into the review prompt to help Claude recognize the similar patterns when reviewing"],
      answer:0,
      exp:"使用<strong>第二個獨立的 Claude 實例</strong>（沒有生成者的先前推理 context）來審查生成的代碼，比 self-review 指令或擴展思考<strong>更有效地捕捉微妙問題</strong>。模型保留了生成時的推理 context，使它不太可能在同一 session 中質疑自己的決策。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：<code>/review</code> 指令再嚴格仍在同一實例、帶著生成偏向，治標。C 錯在哪：擴展思考讓推理更深，但無法消除「審查自己剛寫的程式碼」的偏向。D 錯在哪：few-shot 錯誤範例能幫忙辨識模式，但同一 session 的自我審查偏向仍在。"
    },
    {
      q:"A PR modifies 12 files across the authentication system. Your single-pass review of all 12 files simultaneously produces inconsistent results: thorough feedback on some files but superficial comments on others, and flags the same pattern as problematic in one file while approving it in another. How should you restructure?",
      opts:["Split into per-file passes: review each of the 12 files locally, then run a separate pass focused on cross-file data flow","Run the review three times over all 12 files and then report only the issues that appear in at least 2 of the 3 runs","Switch to a model with a larger context window so all 12 of the files get adequate attention within a single review pass","Require the developer to break the PR into smaller 4-5 file submissions before the automated review is allowed to run"],
      answer:0,
      exp:"將大型多文件審查<strong>分割為每個文件的本地分析 passes 加上單獨的 cross-file 集成 pass</strong>，可以避免注意力稀釋（attention dilution）和矛盾的發現。逐文件分析確保每個文件都得到一致深度的審查，而單獨的集成 pass 則捕捉跨文件的數據流問題。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：跑三次取多數決成本高，且若注意力稀釋是系統性的，三次都可能漏同一處。C 錯在哪：更大的 context window 解決的是容量，不是 12 檔同看時的注意力稀釋。D 錯在哪：要開發者拆 PR 把問題丟回給人，且仍未提供跨檔的整合審查。"
    },
    {
      q:"Your CI review system flags many false positives in the database query category. You want to track which code patterns are most frequently dismissed by developers to improve the prompts. What should you add to the structured review output?",
      opts:["Add a <code>detected_pattern</code> field recording the exact construct that triggered each finding (e.g. \"raw string interpolation in SQL\")","Add a <code>developer_action</code> field that gets populated whenever developers mark one of the findings as a false positive","Log every single dismissed finding to a database so that the prompt-engineering team is able to analyze them all by hand at a later point","Set up A/B testing of several different review prompts and compare the false-positive rates between the variants"],
      answer:0,
      exp:"在結構化發現中添加 <strong><code>detected_pattern</code> 字段</strong>，記錄觸發審查的特定代碼構造（例如「SQL 查詢中的原始字符串插值」），可以對開發者消除模式進行<strong>系統性分析</strong>。這個反饋循環讓你能夠識別哪些代碼構造會觸發高假陽性率的發現，從而系統性地改進 prompts。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：<code>developer_action</code> 記錄的是「開發者怎麼處理」，沒記下「哪種程式碼構造觸發」，無法分析模式。C 錯在哪：把消除的發現全丟資料庫靠人工看，缺少結構化的觸發構造欄位仍難系統分析。D 錯在哪：A/B 測試比較整體假陽性率，但看不出是哪些具體構造造成的。"
    },
    {
      q:"Your team wants to iteratively improve test generation quality. Currently, generated tests often miss edge cases and don't cover error paths. What approach would most effectively guide Claude toward better test generation?",
      opts:["Write a representative test suite (expected behavior, edge cases, error paths), run Claude's tests against it, and share the failures back","Add detailed instructions to the prompt that try to spell out every single edge-case type that ought to be covered","Put a test checklist into CLAUDE.md that Claude is supposed to verify for completeness after it generates the tests","Add few-shot examples of three complete test files showing the level of quality and the coverage that you would expect to see in the output"],
      answer:0,
      exp:"<strong>Test-driven iteration</strong>：首先編寫涵蓋預期行為、邊界案例和錯誤路徑的測試套件，然後通過<strong>分享測試失敗來迭代指導改進</strong>，是最有效的方式。測試失敗提供了具體、明確的改進信號——「這個 edge case 沒有被覆蓋」比試圖在 prompt 中預測和規定所有可能的 edge case 要好得多。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：想在 prompt 裡窮舉所有 edge case 不切實際，漏掉的正是你沒想到的那些。C 錯在哪：清單靠模型自我核對完整性，仍是概率性的，沒有客觀的失敗訊號。D 錯在哪：few-shot 範例能教格式與風格，但無法像「跑測試看失敗」那樣指出具體未涵蓋的案例。"
    },
    {
      q:"Your CI review system generates 80 findings per PR. Every finding goes to a queue where senior engineers spend 40 minutes per PR on review. Analysis of past data shows 70% of findings could be auto-resolved or dismissed, while 30% genuinely need expert judgment. Senior engineer time is a scarce resource. What architectural addition best enables routing only the 30% that need human judgment to senior reviewers?",
      opts:["Add a verification pass where the model self-reports a confidence score, then calibrate routing thresholds against a labeled validation set","Route only Critical and Warning findings to senior engineers and auto-dismiss every Info-level one as rarely needing expert judgment","Run a second independent Claude instance over each finding and route it to a human only when both of the instances flag the same issue","Add a developer feedback loop that automatically suppresses findings similar to ones developers have already dismissed before"],
      answer:0,
      exp:"<strong>Verification pass（驗證通道）</strong>讓模型在每個發現旁邊自我回報信心分數，再使用 labeled validation set 校準路由閾值——確認哪個信心水平可靠地預測真正的問題 vs 假陽性。這樣有限的人工審查能力可以精確路由到最需要判斷的發現。僅按嚴重性過濾（B）假設 severity 標籤本身準確，但 severity 標籤也可能不正確；第二個獨立實例（C）改善準確性但不解決路由效率問題，且成本加倍；開發者反饋循環（D）是事後補救，無法預測哪些發現需要即時人工審查。"
    }
  ]
},
{
  id:6,
  title:"Scenario 6: Structured Data Extraction",
  desc:"You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates the output using JSON schemas, and maintains high accuracy. It must handle edge cases gracefully and integrate with downstream systems.",
  domains:"Primary domains: Prompt Engineering & Structured Output · Context Management & Reliability",
  questions:[
    {
      q:"You need to extract structured data (company name, revenue, fiscal year, currency) from financial report PDFs. Some reports use narrative format, others use tables. What is the most reliable approach to ensure schema-compliant output?",
      opts:["Define an extraction tool with a JSON schema as its input and use <code>tool_use</code>, so the output is schema-valid with no syntax errors","Ask Claude to emit the data as JSON in its response text, and then parse that response afterward with a JSON parser","Use a two-pass approach: first extract the raw text, then convert that text into JSON in a separate follow-up API call","Use the <code>--json-schema</code> CLI flag to enforce structured output when extracting from the financial report PDFs"],
      answer:0,
      exp:"使用 <strong>tool use (<code>tool_use</code>) 結合 JSON schemas</strong> 是獲得保證 schema 合規的結構化輸出最可靠的方式，<strong>消除了 JSON 語法錯誤</strong>。讓 Claude 在其響應文本中輸出 JSON（B）可能產生格式不正確的 JSON 或在 JSON 中混入解釋性文本。Tool use 確保輸出符合精確的 schema 定義。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：要模型在回應文字裡輸出 JSON，可能格式錯誤或混入說明文字。C 錯在哪：兩段式先抽文字再轉 JSON，第二步仍可能產生不符 schema 的 JSON。D 錯在哪：<code>--json-schema</code> 是 Claude Code CLI 的旗標，這裡用的是 Claude API 的 tool_use，情境不符。"
    },
    {
      q:"Your extraction system processes different document types: financial reports, legal contracts, and technical specs. Each has its own extraction schema. You want to guarantee Claude always calls one of your extraction tools (not return conversational text) but you don't know in advance which document type a given document is. What <code>tool_choice</code> setting should you use?",
      opts:["<code>tool_choice: \"any\"</code> — guarantees the model calls a tool while still letting it pick the schema for the document type","<code>tool_choice: \"auto\"</code> — lets the model decide whether to call a tool at all or to just return plain text","<code>tool_choice: {\"type\":\"tool\",\"name\":\"extract_financial\"}</code> — forces one specific tool for consistent behavior","No <code>tool_choice</code> setting at all — the model will naturally select the right extraction tool from the descriptions"],
      answer:0,
      exp:"<strong><code>tool_choice: \"any\"</code></strong> 保證模型調用工具（而不是返回對話文本），但讓它根據文檔類型選擇哪個提取 schema。<code>tool_choice: \"auto\"</code>（B）允許模型返回文本而不是調用工具；強制特定工具（C）在文檔類型未知時不適用；沒有 <code>tool_choice</code>（D）與 \"auto\" 相同，不保證工具調用。"
    },
    {
      q:"When extracting data from financial reports, some reports don't include the CFO's name. Your current schema has <code>cfo_name</code> as a required field. Extractions frequently return placeholder text like \"Not mentioned\" or \"N/A\" for this field. How should you fix the schema?",
      opts:["Make <code>cfo_name</code> an optional, nullable field so the model won't fabricate a value just to satisfy a required field","Add instructions telling the model to return <code>null</code> for any missing field rather than emitting placeholder text","Add a post-processing step that converts placeholder strings like \"N/A\" into proper <code>null</code> values afterward","Remove <code>cfo_name</code> from the schema and run a separate extraction step dedicated specifically to just that one field"],
      answer:0,
      exp:"當源文檔可能不包含某些信息時，應將 schema 字段設計為<strong>可選（nullable）</strong>，以防止模型為了滿足必填字段而<strong>捏造值</strong>。Required 字段會向模型施加壓力，促使其在信息缺失時提供某些值（即使是佔位符或捏造的值）。將 <code>cfo_name</code> 設計為 optional/nullable 讓模型在信息缺失時返回 null。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：必填欄位仍對模型施壓去填值，光靠指令「缺就回 null」無法抵消 schema 的必填壓力。C 錯在哪：事後把佔位字串轉 null 是清理症狀，沒阻止模型一開始就捏造值。D 錯在哪：移除欄位另開一次提取增加複雜度與成本，nullable 一步就解決。"
    },
    {
      q:"Your extraction schema for document classification needs to handle a wide variety of document types, but you only know 8 common types. New document types appear occasionally. How should you design the <code>document_type</code> field?",
      opts:["Use an enum of the 8 known types plus <code>\"other\"</code>, with a <code>document_type_detail</code> string the model fills when \"other\" is chosen","Use an unconstrained free-text string field so the model is free to describe any document type that it happens to encounter","Use an enum that contains only the 8 known types, and simply reject any document that doesn't fit one of them","Use an enum of the 8 known types plus an <code>\"unknown\"</code> value for documents that just can't be confidently classified"],
      answer:0,
      exp:"使用 <strong>enum 加上「<code>other</code>」+ detail string 的模式</strong>允許可擴展的分類，同時保持對已知類型的結構化輸出。這讓模型可以為常見文檔類型使用預定義值，對不尋常類型在 detail 字段中提供描述，而不是在 free-text 字段中犧牲所有結構，也不是通過拒絕新類型（C）來破壞提取。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：完全不設限的 free-text 會犧牲所有結構，下游難以可靠消費。C 錯在哪：只用 8 種類型並拒絕不符的文件，會讓新類型文件直接無法提取。D 錯在哪：加 <code>\"unknown\"</code> 雖能避免拒絕，但只標記為未知、丟失了可記錄的細節，不如 <code>\"other\"</code> + detail 字段保留描述。"
    },
    {
      q:"Your extraction system retrieves invoice data, but validation frequently fails because the calculated sum of line items doesn't match the invoice total field. Retries with the same prompt don't improve accuracy. What approach would most effectively fix this?",
      opts:["Send follow-up requests that include the original document, the failed extraction, and the specific discrepancy for self-correction","Add to the system prompt: \"always verify that the line items sum to the stated total before you ever return any extraction results\"","Add a post-processing calculation that simply replaces the extracted total with the calculated sum of the line items","Filter out the invoices with discrepancies and only ever process the invoices whose totals are already consistent"],
      answer:0,
      exp:"實作包含原始文件、失敗的提取和具體驗證錯誤的<strong>後續請求（retry-with-error-feedback）</strong>，可以引導模型自我修正。具體的驗證錯誤（「行項目總和為 $1,250，但聲明的總額為 $1,350」）比通用的 system prompt 指令更有效地指導模型找到問題所在。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：通用的 prompt 指令「先驗證再回傳」已被題目證實重試也沒改善，不夠具體。C 錯在哪：直接用計算總和覆蓋抽取的總額，是假設行項目一定對、總額一定錯，可能掩蓋真正的抽取錯誤。D 錯在哪：直接濾掉不一致的發票等於放棄處理它們，沒解決抽取準確度問題。"
    },
    {
      q:"Your extraction system processes research papers. Each paper should have a methodology section, but some papers don't include one explicitly—the methodology is woven throughout the text. Retrying with the same prompt consistently returns <code>null</code> even when you believe the information is present. What should you try first?",
      opts:["Add few-shot examples showing correct extraction of methodology from papers where it's woven through the prose, not in a section","Increase the maximum retry count from 3 up to 10 so that the model simply gets more attempts at the extraction","Change the methodology field from optional to required, so as to force the model to extract something for it","Switch to a different extraction model that is reputed to have noticeably better understanding of research-paper documents overall"],
      answer:0,
      exp:"重試在以下情況<strong>無效</strong>：信息確實存在於文件中但以不同的格式呈現（非專用 section）。在這種情況下，模型需要<strong>few-shot 範例</strong>來了解如何從分散的文本中提取 methodology，而不是從專用 section 中。增加重試次數（B）對方法論問題無效；使字段為必填（C）會增加幻覺。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：資訊以非專用 section 形式存在時，重試再多次仍是同一種看法，無效。C 錯在哪：把欄位改必填會逼模型在資訊分散時硬擠出值，反而增加幻覺。D 錯在哪：換一個「更強」模型是昂貴又不確定的賭注，根因是缺少示範如何從敘述文字抽取的 few-shot 範例。"
    },
    {
      q:"Your code review extraction system flags issues, but developers dismiss 65% of \"type_mismatch\" findings as false positives. You want to systematically analyze what code patterns are triggering these false positives. What should you add to the extraction schema?",
      opts:["Add a <code>detected_pattern</code> field recording the exact construct that triggered each finding (e.g. \"implicit type coercion in comparison\")","Add a <code>developer_dismissed</code> boolean field that gets set whenever a developer marks one of the findings as a false positive in the review UI","Add a <code>confidence_score</code> field to each finding and then simply filter out every finding that scores below 0.8","Add a <code>false_positive_likelihood</code> field where Claude itself estimates whether its own finding might be a false positive"],
      answer:0,
      exp:"在結構化發現中添加 <strong><code>detected_pattern</code> 字段</strong>，記錄觸發發現的特定代碼構造，可以對開發者消除模式進行<strong>系統性分析</strong>。這個反饋循環讓你識別哪些特定的代碼模式一致地觸發假陽性，從而系統性地改進提取 prompts 或 criteria。<br><br><strong>近似錯誤選項解析：</strong>B 錯在哪：<code>developer_dismissed</code> 只記下「被消除」，沒記錄觸發的程式碼構造，無法分析模式。C 錯在哪：用信心分數過濾只是丟掉低分發現，看不出是哪種構造造成假陽性。D 錯在哪：讓模型自評是否為假陽性仍是不可靠的自我報告，且不提供可分析的構造分類。"
    },
    {
      q:"Your extraction validation confirms that all extracted invoice fields have the correct data types (strings are strings, numbers are numbers), but amounts still don't sum to totals. What type of error is this, and what does it tell you?",
      opts:["It's a semantic error: tool use with a JSON schema removes syntax errors but can't catch values that don't sum, so business-logic validation is needed","It's a schema syntax error, indicating that the JSON schema you have defined simply isn't strict enough to catch this kind of problem as it stands","It points to a model accuracy problem, the kind of thing you'd solve by switching over to a more capable extraction model","It's a formatting error in which the numbers are being stored as strings and so need to be explicitly parsed first"],

// Task references per scenario (0-indexed) — maps question index → Task number
const taskMap = [
  // Scenario 1: Customer Support Resolution Agent
  ["1.1","1.1","1.4","1.5","1.5","2.1","2.2","5.3","2.3","5.1","5.1","5.2","5.2","1.4","1.4","2.1"],
  // Scenario 2: Code Generation with Claude Code
  ["3.1","3.1","3.1","3.2","3.2","3.2","3.3","3.3","3.4","3.4","3.5","3.5","1.7","1.7","5.4","3.1","3.5"],
  // Scenario 3: Multi-Agent Research System
  ["1.2","1.2","5.6","1.3","1.3","1.6","5.3","2.3","5.4","2.2","5.3","5.6","5.6","1.3","1.2"],
  // Scenario 4: Developer Productivity with Claude
  ["2.5","2.5","2.5","2.4","2.4","2.4","2.4","2.1","2.3","2.3","3.4","3.2","3.1","5.4","1.6","2.4"],
  // Scenario 5: Claude Code for Continuous Integration
  ["3.6","3.6","4.6","3.6","4.1","4.1","4.1","4.2","3.6","4.5","4.5","4.6","4.6","4.4","4.4","4.6"],
  // Scenario 6: Structured Data Extraction
  ["4.3","4.3","4.3","4.3","4.4","4.4","4.4","4.3","4.5","4.5","4.2","5.1","5.5","5.5","5.6"]
];

let state = {
  current: 0,
  answers: scenarios.map(s => new Array(s.questions.length).fill(-1))
};

function renderNav(){
  const nav = document.getElementById('scenarioNav');
  nav.innerHTML = scenarios.map((s,i) => {
    const answered = state.answers[i].filter(a=>a!==-1).length;
    const total = s.questions.length;
    const done = answered === total;
    return `<button onclick="switchScenario(${i})" class="${i===state.current?'active':done?'done':''}" id="nav-${i}">
      Scenario ${s.id} ${done?'✓':'('+answered+'/'+total+')'}
    </button>`;
  }).join('');
}

function switchScenario(i){
  state.current = i;
  renderNav();
  renderContent();
}

function renderContent(){
  const s = scenarios[state.current];
  const answered = state.answers[state.current];
  const correct = answered.filter((a,i)=>a===s.questions[i].answer).length;
  const total = answered.filter(a=>a!==-1).length;

  let html = `
    <div class="scenario-header">
      <h2>${s.title}</h2>
      <p>${s.desc}</p>
      <div class="domains">${s.domains}</div>
    </div>
    <div class="progress">
      <span>${total}/${s.questions.length} answered</span>
      <div class="progress-bar"><div class="progress-fill" style="width:${(total/s.questions.length)*100}%"></div></div>
      <span>${correct} correct</span>
    </div>`;

  if(total === s.questions.length){
    const pct = Math.round((correct/s.questions.length)*100);
    html += `<div class="result-panel show">
      <div class="big-score">${pct}%</div>
      <p>${correct} / ${s.questions.length} correct on Scenario ${s.id}</p>
      <button class="btn-reset" onclick="resetScenario(${state.current})">Reset Scenario</button>
    </div>`;
  }

  s.questions.forEach((q,qi) => {
    const userAnswer = answered[qi];
    const isAnswered = userAnswer !== -1;
    html += `<div class="question-card${isAnswered?' answered':''}" id="qcard-${qi}">
      <div class="q-header">
        <div class="q-num">${qi+1}</div>
        <div class="q-text">${q.q}</div>
      </div>
      <div class="options">`;
    q.opts.forEach((opt,oi) => {
      let cls = 'option';
      if(isAnswered){
        cls += ' disabled';
        if(oi === q.answer) cls += ' correct';
        else if(oi === userAnswer) cls += ' wrong';
      }
      html += `<div class="${cls}" onclick="${isAnswered?'':(`selectAnswer(${qi},${oi})`)}">
        <span class="opt-label">${['A','B','C','D'][oi]}</span>
        <span>${opt}</span>
      </div>`;
    });
    const taskNum = (taskMap[state.current]||[])[qi];
    html += `</div>
      <div class="explanation${isAnswered?' show':''}" id="exp-${qi}">
        ${taskNum?`<span class="task-ref">Task ${taskNum}</span>`:''}
        <strong>解析：</strong> ${q.exp}
      </div>
    </div>`;
  });

  document.getElementById('mainContent').innerHTML = html;
  updateTotal();
}

function selectAnswer(qi, oi){
  state.answers[state.current][qi] = oi;
  renderContent();
  renderNav();
  setTimeout(()=>{
    const card = document.getElementById(`qcard-${qi}`);
    if(card) card.scrollIntoView({behavior:'smooth', block:'nearest'});
  }, 100);
}

function resetScenario(i){
  state.answers[i] = new Array(scenarios[i].questions.length).fill(-1);
  renderNav();
  renderContent();
}

function updateTotal(){
  let total = 0, correct = 0;
  scenarios.forEach((s,i) => {
    s.questions.forEach((q,qi) => {
      if(state.answers[i][qi] !== -1){
        total++;
        if(state.answers[i][qi] === q.answer) correct++;
      }
    });
  });
  document.getElementById('totalScore').textContent = `${correct} / ${total}`;
}

// Shuffle option order once per page load so correct answer is not always A.
// Explanations reference distractors by their original letter (B/C/D), so we
// remap those letter references to follow the shuffle — otherwise they would
// point at the wrong displayed options. The regex only matches a standalone
// A–D bounded by non-Latin chars, so multi-letter terms (API, ISO, JSON…) are
// never touched.
(function shuffleOptions(){
  const L=['A','B','C','D'];
  scenarios.forEach(s=>{
    s.questions.forEach(q=>{
      const idx=[0,1,2,3];
      for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
      const orig=q.opts.slice();
      q.opts=idx.map(i=>orig[i]);
      q.answer=idx.indexOf(q.answer);
      // origPos -> new display position, used to relabel letter references
      const origToNew={}; idx.forEach((origPos,newPos)=>{origToNew[origPos]=newPos;});
      if(q.exp){
        q.exp=q.exp.replace(/(^|[^A-Za-z])([A-D])(?![A-Za-z])/g,
          (m,pre,ch)=>pre+L[origToNew[L.indexOf(ch)]]);
      }
    });
  });
})();

renderNav();
renderContent();
</script>
