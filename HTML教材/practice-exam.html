<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCA Foundations — Practice Exam</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--accent:#7c6af7;--accent2:#5eead4;--correct:#22c55e;--wrong:#ef4444;--text:#e2e8f0;--muted:#8892a4;--warn:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:0 0 60px}
header{background:linear-gradient(135deg,#1e1b4b,#1a1d27);border-bottom:1px solid var(--border);padding:24px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
header h1{font-size:1.4rem;font-weight:700;color:#fff;letter-spacing:-.02em}
header .badge{background:var(--accent);color:#fff;font-size:.75rem;padding:4px 12px;border-radius:20px;font-weight:600}
.score-bar{display:flex;gap:20px;font-size:.85rem;color:var(--muted)}
.score-bar span{color:var(--text);font-weight:600}
nav{display:flex;gap:8px;overflow-x:auto;padding:16px 32px;border-bottom:1px solid var(--border);background:var(--card);scrollbar-width:thin}
nav button{flex-shrink:0;padding:8px 18px;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:8px;cursor:pointer;font-size:.85rem;transition:all .2s;white-space:nowrap}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
nav button.done{border-color:var(--correct);color:var(--correct)}
.main{max-width:860px;margin:0 auto;padding:32px 24px}
.scenario-header{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:32px}
.scenario-header h2{font-size:1.1rem;color:var(--accent2);margin-bottom:8px;font-weight:600}
.scenario-header p{font-size:.9rem;color:var(--muted);line-height:1.6}
.scenario-header .domains{margin-top:12px;font-size:.8rem;color:var(--warn)}
.question-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px;transition:border-color .2s}
.question-card.answered{border-color:var(--border)}
.q-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.q-num{background:var(--accent);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0;margin-top:1px}
.q-text{font-size:.93rem;line-height:1.65;color:var(--text)}
.q-text code{background:#252836;padding:1px 6px;border-radius:4px;font-family:'Fira Code',monospace;font-size:.87em;color:var(--accent2)}
.options{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.option{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s;font-size:.88rem;line-height:1.55;color:var(--muted)}
.option:hover:not(.disabled){border-color:var(--accent);color:var(--text);background:rgba(124,106,247,.07)}
.option .opt-label{font-weight:700;color:var(--accent);flex-shrink:0;min-width:20px}
.option.correct{border-color:var(--correct);background:rgba(34,197,94,.08);color:var(--text)}
.option.correct .opt-label{color:var(--correct)}
.option.wrong{border-color:var(--wrong);background:rgba(239,68,68,.08);color:var(--text)}
.option.wrong .opt-label{color:var(--wrong)}
.option.disabled{cursor:default}
.option code{background:#252836;padding:1px 5px;border-radius:3px;font-family:'Fira Code',monospace;font-size:.85em;color:var(--accent2)}
.explanation{margin-top:14px;padding:14px 16px;background:#111827;border-left:3px solid var(--accent2);border-radius:0 8px 8px 0;font-size:.86rem;line-height:1.65;color:#94a3b8;display:none}
.explanation.show{display:block}
.explanation strong{color:var(--accent2)}
.progress{display:flex;align-items:center;gap:12px;margin-bottom:24px;font-size:.85rem;color:var(--muted)}
.progress-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.result-panel{display:none;text-align:center;padding:40px 24px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:24px}
.result-panel.show{display:block}
.result-panel .big-score{font-size:3.5rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.result-panel p{color:var(--muted);margin-top:8px}
.btn-reset{margin-top:20px;padding:10px 28px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600;transition:opacity .2s}
.btn-reset:hover{opacity:.85}
.task-ref{display:inline-block;background:rgba(94,234,212,.12);color:var(--accent2);font-size:.73rem;font-weight:700;padding:2px 9px;border-radius:4px;margin-right:8px;font-family:'Fira Code',monospace;letter-spacing:.03em;vertical-align:middle;border:1px solid rgba(94,234,212,.25)}
</style>
</head>

<script>
const scenarios = [
{
  id:1,
  title:"Scenario 1: Customer Support Resolution Agent",
  desc:"You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to your backend systems through custom MCP tools (<code>get_customer</code>, <code>lookup_order</code>, <code>process_refund</code>, <code>escalate_to_human</code>). Your target is 80%+ first-contact resolution while knowing when to escalate.",
  domains:"Primary domains: Agentic Architecture & Orchestration · Tool Design & MCP Integration · Context Management & Reliability",
  questions:[
    {
      q:"Your agentic loop uses this termination logic: <code>while True: response = call_claude(); if \"I have completed\" in response.content[0].text: break</code>. Production logs show the agent sometimes terminates mid-task when the model uses phrases like \"I have completed looking up the customer.\" What is the correct approach to implement loop termination?",
      opts:["Continue the loop when <code>stop_reason</code> is <code>\"tool_use\"</code> and terminate when <code>stop_reason</code> is <code>\"end_turn\"</code>, regardless of response text content","Use <code>stop_reason</code> as the primary signal but maintain a keyword fallback list as a safety net for cases where the API behaves unexpectedly","Set a maximum iteration count of 10 as the primary stopping mechanism to prevent infinite loops","Check if the assistant's response contains a <code>tool_use</code> content block before deciding whether to continue"],
      answer:0,
      exp:"正確的 agentic loop 應依據 <strong>stop_reason</strong> 來判斷是否繼續：<code>stop_reason</code> 為 <code>\"tool_use\"</code> 時繼續執行，<code>stop_reason</code> 為 <code>\"end_turn\"</code> 時才終止。解析自然語言文字來判斷完成是不可靠的 anti-pattern，因為模型可能在任何地方使用類似完成的措辭。設定固定迭代上限作為主要停止機制也是 anti-pattern。"
    },
    {
      q:"After calling <code>get_customer</code>, your agent calls Claude again to decide the next step, but Claude responds as if it has no information about the customer that was just retrieved. What is the most likely cause?",
      opts:["The <code>get_customer</code> tool result was not appended to the conversation history before making the next API call","The <code>stop_reason</code> for the <code>get_customer</code> call was <code>\"end_turn\"</code> instead of <code>\"tool_use\"</code>","Claude's context window has been exceeded by the tool description definitions","The <code>get_customer</code> tool description does not specify the format of its return value"],
      answer:0,
      exp:"在 agentic loop 中，每次 tool 執行完畢後，必須將 <strong>tool result 加入到 conversation history</strong> 中，這樣模型才能在下一次 API 請求時推理這些結果。如果沒有將 tool result 加回對話歷史，模型就會對之前的 tool 呼叫一無所知。"
    },
    {
      q:"The system prompt says \"Always verify customer identity with <code>get_customer</code> before processing any refund.\" Production logs show this instruction is followed 94% of the time, but 6% of cases still skip verification. What change would guarantee compliance?",
      opts:["Implement a programmatic prerequisite that blocks <code>process_refund</code> calls until <code>get_customer</code> has returned a verified customer ID","Add five few-shot examples to the system prompt showing <code>get_customer</code> always called before <code>process_refund</code>","Change the system prompt to \"You MUST ALWAYS verify customer identity first. This is non-negotiable.\"","Use <code>tool_choice: \"any\"</code> to force the model to call a tool on every turn"],
      answer:0,
      exp:"當業務邏輯需要<strong>確定性合規保障</strong>（如身份驗證必須在金融操作之前），僅靠 prompt 指令無法保證零失敗率。<strong>程式化的前置條件</strong>才能提供確定性保障：在 <code>get_customer</code> 未回傳已驗證的 customer ID 之前，<code>process_refund</code> 工具根本不會被執行。B 和 C 只是改善 prompt，仍有失敗率。"
    },
    {
      q:"Your MCP tools return dates in different formats: <code>get_customer</code> returns Unix timestamps, <code>lookup_order</code> returns ISO 8601 strings, and a shipping tool returns \"MM/DD/YYYY\". This inconsistency causes errors when the agent compares dates across tools. What is the most effective architectural solution?",
      opts:["Implement a <code>PostToolUse</code> hook that normalizes all date formats to a standard format before the agent processes tool results","Update each tool's description to document its date format so the agent knows how to handle each one","Add instructions to the system prompt telling the agent to always convert dates to ISO 8601 before comparison","Create a separate <code>date_normalize</code> tool that the agent can call whenever it needs to compare dates"],
      answer:0,
      exp:"<strong>PostToolUse hook</strong> 可以在模型處理 tool 結果之前攔截並轉換資料格式，提供確定性保障，確保模型永遠只看到標準化後的資料。B 只是文件化問題；C 依賴模型的概率性合規；D 增加不必要的複雜性和額外 API 呼叫。"
    },
    {
      q:"Your business policy states that refunds above $500 must be reviewed by a human agent before processing. You want to enforce this rule programmatically. Which approach best implements this requirement?",
      opts:["Implement a pre-tool-call interception hook that checks the refund amount and redirects to <code>escalate_to_human</code> when the amount exceeds $500","Add to the system prompt: \"If the refund amount is more than $500, you must escalate to a human agent\"","Configure <code>process_refund</code> to return an error with a policy message when the amount exceeds $500","Use few-shot examples showing five cases where the agent correctly escalated high-value refunds"],
      answer:0,
      exp:"業務規則需要確定性合規保障時，應使用 <strong>hook 而非 prompt 指令</strong>。Hook 可以在 tool 呼叫發出之前攔截並強制執行政策，完全繞過模型的決策，提供 100% 的合規率。B 和 D 依賴模型的概率性遵循，有失敗風險。"
    },
    {
      q:"Your agent frequently calls <code>get_customer</code> when users ask about order status, even when they provide an order number directly (e.g., \"Where is order #12345?\"). Both tools have one-sentence descriptions. What is the most effective first step to fix this misrouting?",
      opts:["Expand each tool's description to include input formats, example queries, edge cases, and when to use it versus similar tools","Add few-shot examples to the system prompt showing order queries routing to <code>lookup_order</code>","Rename <code>get_customer</code> to <code>fetch_account_profile</code> and <code>lookup_order</code> to <code>fetch_order_details</code>","Implement a pre-processing layer that detects order numbers in user messages and selects <code>lookup_order</code>"],
      answer:0,
      exp:"<strong>Tool descriptions 是 LLM 進行 tool selection 的主要機制</strong>。當 descriptions 過於簡短時，模型缺乏足夠的上下文來區分相似的 tools。直接提升 tool descriptions（加入輸入格式、範例 queries、邊界條件）是最直接有效的修正方式。B 增加了 token 開銷但沒有解決根本原因；D 是過度設計。"
    },
    {
      q:"Your <code>process_refund</code> MCP tool sometimes returns a generic error: \"Operation failed.\" The agent then retries the same refund multiple times, causing duplicate charges. What should the tool return to prevent this?",
      opts:["Structured error metadata including <code>errorCategory</code> (e.g., \"validation\"), <code>isRetryable: false</code>, and a human-readable description of why the operation failed","An HTTP 400 status code to signal a client error that should not be retried","The error message \"Operation failed. Please do not retry.\" to instruct the agent","An empty result with <code>isError: true</code> to signal failure without revealing implementation details"],
      answer:0,
      exp:"<strong>結構化的錯誤 metadata</strong> 讓 agent 能做出明智的恢復決策。<code>isRetryable: false</code> 明確告知 agent 不要重試；<code>errorCategory</code> 幫助 agent 理解是驗證錯誤還是暫時性錯誤。一般的錯誤訊息無法讓 agent 區分哪些錯誤可以重試。"
    },
    {
      q:"A subagent reports a \"database connection timeout\" error while looking up an order. Which error propagation strategy best enables the coordinator to make intelligent recovery decisions?",
      opts:["Return structured error context including failure type (\"transient\"), the attempted query, any partial results, and potential alternative approaches such as cache lookup","Automatically retry 3 times within the subagent, then return a generic \"lookup unavailable\" status","Return an empty order list marked as a successful result so the workflow can continue","Terminate the entire customer support workflow and ask the user to try again later"],
      answer:0,
      exp:"<strong>結構化的錯誤 context</strong> 讓 coordinator 能做出智能的恢復決策——判斷是否重試、嘗試替代方案，還是帶著部分結果繼續。B 的通用狀態隱藏了有價值的 context；C 將存取失敗偽裝成成功的空結果，阻止了任何恢復；D 因單一失敗就終止整個工作流程是不必要的。"
    },
    {
      q:"You have 18 available MCP tools covering customer lookup, order management, refund processing, shipping tracking, loyalty points, promotional codes, and account management. The agent frequently calls the wrong tool. What architectural change would most improve tool selection reliability?",
      opts:["Restrict each agent to 4-5 tools most relevant to its specific role; use a coordinator agent to route requests to specialized subagents","Improve each tool's description to be more detailed and include examples of when to use it versus alternatives","Set <code>tool_choice: \"any\"</code> to force the agent to always call a tool rather than returning conversational text","Add a routing classifier that analyzes each request and pre-selects the correct tool before the agent runs"],
      answer:0,
      exp:"給 agent 太多 tools（18 個而非 4-5 個）<strong>增加決策複雜度，降低 tool selection 可靠性</strong>。最有效的架構解決方案是限制每個 agent 只能存取其角色所需的 tools，通過 coordinator 將不同類型的請求路由到專門的 subagents。B 有幫助但對 18 個 tools 效果有限。"
    },
    {
      q:"After a long multi-issue conversation, the agent starts losing track of specific details mentioned early—like exact dollar amounts the customer quoted or specific dates mentioned. What is the most effective solution?",
      opts:["Extract transactional facts (amounts, dates, order numbers, customer-stated expectations) into a persistent \"case facts\" block included in each prompt, separate from summarized conversation history","Increase the context window by using a model with more tokens to accommodate longer histories","Summarize the conversation after every 5 turns to keep context concise and within limits","Store all conversation details in a database and retrieve them on demand"],
      answer:0,
      exp:"<strong>Progressive summarization 的風險</strong>：壓縮數字值、百分比、日期和客戶陳述的期望為模糊的摘要。解決方案是將交易性事實（金額、日期、訂單號、狀態）提取到持久的「<strong>case facts</strong>」區塊，在每個 prompt 中包含此區塊，獨立於摘要的對話歷史，確保關鍵數據不會在摘要過程中丟失。"
    },
    {
      q:"Your <code>get_customer</code> tool returns a 45-field record, but the agent typically only needs 5-6 fields for most support operations. As conversations grow longer, you notice performance degradation. What is the best approach?",
      opts:["Trim the tool output to return only the fields relevant to support operations before appending it to the conversation context","Instruct the agent in the system prompt to ignore irrelevant fields from tool responses","Create a separate lightweight <code>get_customer_summary</code> tool for quick lookups","Use the full tool output but periodically run <code>/compact</code> to reduce context size"],
      answer:0,
      exp:"Tool 結果在 context 中積累，消耗與其相關性<strong>不成比例的 tokens</strong>（每次查詢 40+ 個欄位，但只有 5 個相關）。在結果加入 context 之前進行裁剪，可以防止這種積累。B 依賴模型忽略信息，但這些信息仍然佔用 context 空間；D 解決症狀而非根本原因。"
    },
    {
      q:"A customer messages: \"I'm really frustrated. I've tried to resolve this billing issue three times and nobody has helped. I want to speak to a human representative right now.\" What should the agent do?",
      opts:["Immediately escalate to a human agent using <code>escalate_to_human</code> without first attempting to resolve the billing issue","Acknowledge the customer's frustration, then investigate the billing issue and attempt resolution before escalating","Escalate only after attempting resolution and the customer repeats the request for a human","Use sentiment analysis to determine if the frustration level warrants escalation"],
      answer:0,
      exp:"當客戶<strong>明確要求與人工客服溝通時，應立即遵從</strong>，不需要先嘗試調查或解決問題。明確的客戶要求是最高優先級的升級觸發器。B 和 C 都是在客戶已明確要求人工服務後仍試圖自行解決；D 將情緒分析作為代理指標是不可靠的。"
    },
    {
      q:"A customer requests a competitor price match. Your policy addresses price matching for your own website's historical prices but is silent on competitor pricing. The agent has verified the account and the product. What should the agent do?",
      opts:["Escalate to a human agent because the policy is ambiguous or silent on this specific request type","Decline the request since the policy does not explicitly authorize competitor price matching","Process the competitor price match since the policy does not explicitly prohibit it","Ask the customer to provide documentation of the competitor's price, then process it if reasonable"],
      answer:0,
      exp:"當政策對客戶的<strong>具體請求模糊不清或沒有明確說明時，應升級給人工客服</strong>，而不是讓 agent 自行做政策解讀。這屬於「政策例外/缺口」升級觸發器。政策只涵蓋自家網站的歷史價格，競爭對手價格匹配屬於政策空白地帶，需要人工判斷。"
    },
    {
      q:"Your agent handles multi-issue requests poorly—it addresses one issue and closes the case without investigating others. A customer reports: \"My order arrived damaged AND I was double-charged.\" What architectural pattern would best address this?",
      opts:["Decompose the multi-concern request into distinct items, investigate each in parallel using shared context, then synthesize a unified response","Instruct the agent to list all detected issues at the start of each response before resolving any","Process issues sequentially: resolve the first issue completely before starting the second","Ask the customer to submit separate support tickets for each issue"],
      answer:0,
      exp:"多問題客戶請求應<strong>分解為不同的項目，在共享 context 下並行調查每個問題，最後合成統一回應</strong>。這確保了每個問題都得到充分調查，而不是在第一個問題解決後忽略其他問題。並行調查比順序調查更有效率。"
    },
    {
      q:"The agent collects customer details, verifies the order, processes a refund—then transfers the case to a human specialist who has no access to the conversation transcript. The specialist asks the customer to repeat all information. How should the agent handle the transfer?",
      opts:["Compile a structured handoff summary including customer ID, order details, root cause analysis, refund amount processed, and recommended next actions before escalating","Paste the entire conversation transcript into the escalation ticket so the specialist has all context","Ask the customer to briefly summarize their issue for the specialist before escalating","Transfer all conversation history as raw JSON from the API response to the escalation system"],
      answer:0,
      exp:"<strong>結構化的交接摘要</strong>（customer ID、根本原因分析、退款金額、建議後續行動）確保人工客服能快速上手，無需重新詢問客戶已提供過的信息。原始對話記錄（B）對專家難以快速消化；讓客戶重新摘要（C）增加客戶負擔；原始 JSON（D）不適合人工閱讀。"
    },
    {
      q:"Your customer support system prompt includes the instruction: \"When a customer references their account details, verify the information.\" Analytics show the agent calls <code>get_customer</code> on nearly every turn—including product feature questions—because product descriptions frequently contain the words \"details\" and \"information\". Your tool descriptions are already clear and well-differentiated. What is the most likely root cause?",
      opts:["The system prompt's phrasing creates a keyword association—\"details\" and \"information\" trigger <code>get_customer</code> regardless of context; rephrase the instruction to remove the ambiguous keyword triggers","The <code>get_customer</code> tool description needs an explicit exclusion clause stating it should not be called for product-related questions","Product description content in the agent's context is confusing its tool selection; restrict product catalog access to a separate retrieval tool","Add few-shot examples in the system prompt showing product questions being answered without calling <code>get_customer</code>"],
      answer:0,
      exp:"<strong>System prompt 中的關鍵字敏感指令</strong>可能覆蓋精心撰寫的 tool descriptions，製造非預期的 tool 關聯。即使 tool descriptions 已經設計良好，system prompt 中含有「verify the information」或「check the details」這類措辭，仍可能在模型遇到「information」或「details」等詞彙時觸發特定工具。解決方法是<strong>審查 system prompt 措辭</strong>，移除或改寫可能形成非預期關聯的關鍵字觸發器。這是 Task 2.1 的一個獨立知識點：well-written tool descriptions 不足以抵抗 system prompt 中的 keyword-sensitive 指令。"
    }
  ]
},
{
  id:2,
  title:"Scenario 2: Code Generation with Claude Code",
  desc:"You are using Claude Code to accelerate software development. Your team uses it for code generation, refactoring, debugging, and documentation. You need to integrate it into your development workflow with custom slash commands, CLAUDE.md configurations, and understand when to use plan mode vs direct execution.",
  domains:"Primary domains: Claude Code Configuration & Workflows · Context Management & Reliability",
  questions:[
    {
      q:"A new team member reports that Claude Code behaves differently on their machine—it doesn't follow the team's coding standards or testing patterns. The team's instructions are in <code>~/.claude/CLAUDE.md</code> on the lead developer's machine. What is the most likely cause?",

// Task references per scenario (0-indexed) — maps question index → Task number
const taskMap = [
  // Scenario 1: Customer Support Resolution Agent
  ["1.1","1.1","1.4","1.5","1.5","2.1","2.2","5.3","2.3","5.1","5.1","5.2","5.2","1.4","1.4","2.1"],
  // Scenario 2: Code Generation with Claude Code
  ["3.1","3.1","3.1","3.2","3.2","3.2","3.3","3.3","3.4","3.4","3.5","3.5","1.7","1.7","5.4","3.1","3.5"],
  // Scenario 3: Multi-Agent Research System
  ["1.2","1.2","5.6","1.3","1.3","1.6","5.3","2.3","5.4","2.2","5.3","5.6","5.6","1.3","1.2"],
  // Scenario 4: Developer Productivity with Claude
  ["2.5","2.5","2.5","2.4","2.4","2.4","2.4","2.1","2.3","2.3","3.4","3.2","3.1","5.4","1.6","2.4"],
  // Scenario 5: Claude Code for Continuous Integration
  ["3.6","3.6","4.6","3.6","4.1","4.1","4.1","4.2","3.6","4.5","4.5","4.6","4.6","4.4","4.4","4.6"],
  // Scenario 6: Structured Data Extraction
  ["4.3","4.3","4.3","4.3","4.4","4.4","4.4","4.3","4.5","4.5","4.2","5.1","5.5","5.5","5.6"]
];

let state = {
  current: 0,
  answers: scenarios.map(s => new Array(s.questions.length).fill(-1))
};

function renderNav(){
  const nav = document.getElementById('scenarioNav');
  nav.innerHTML = scenarios.map((s,i) => {
    const answered = state.answers[i].filter(a=>a!==-1).length;
    const total = s.questions.length;
    const done = answered === total;
    return `<button onclick="switchScenario(${i})" class="${i===state.current?'active':done?'done':''}" id="nav-${i}">
      Scenario ${s.id} ${done?'✓':'('+answered+'/'+total+')'}
    </button>`;
  }).join('');
}

function switchScenario(i){
  state.current = i;
  renderNav();
  renderContent();
}

function renderContent(){
  const s = scenarios[state.current];
  const answered = state.answers[state.current];
  const correct = answered.filter((a,i)=>a===s.questions[i].answer).length;
  const total = answered.filter(a=>a!==-1).length;

  let html = `
    <div class="scenario-header">
      <h2>${s.title}</h2>
      <p>${s.desc}</p>
      <div class="domains">${s.domains}</div>
    </div>
    <div class="progress">
      <span>${total}/${s.questions.length} answered</span>
      <div class="progress-bar"><div class="progress-fill" style="width:${(total/s.questions.length)*100}%"></div></div>
      <span>${correct} correct</span>
    </div>`;

  if(total === s.questions.length){
    const pct = Math.round((correct/s.questions.length)*100);
    html += `<div class="result-panel show">
      <div class="big-score">${pct}%</div>
      <p>${correct} / ${s.questions.length} correct on Scenario ${s.id}</p>
      <button class="btn-reset" onclick="resetScenario(${state.current})">Reset Scenario</button>
    </div>`;
  }

  s.questions.forEach((q,qi) => {
    const userAnswer = answered[qi];
    const isAnswered = userAnswer !== -1;
    html += `<div class="question-card${isAnswered?' answered':''}" id="qcard-${qi}">
      <div class="q-header">
        <div class="q-num">${qi+1}</div>
        <div class="q-text">${q.q}</div>
      </div>
      <div class="options">`;
    q.opts.forEach((opt,oi) => {
      let cls = 'option';
      if(isAnswered){
        cls += ' disabled';
        if(oi === q.answer) cls += ' correct';
        else if(oi === userAnswer) cls += ' wrong';
      }
      html += `<div class="${cls}" onclick="${isAnswered?'':(`selectAnswer(${qi},${oi})`)}">
        <span class="opt-label">${['A','B','C','D'][oi]}</span>
        <span>${opt}</span>
      </div>`;
    });
    const taskNum = (taskMap[state.current]||[])[qi];
    html += `</div>
      <div class="explanation${isAnswered?' show':''}" id="exp-${qi}">
        ${taskNum?`<span class="task-ref">Task ${taskNum}</span>`:''}
        <strong>解析：</strong> ${q.exp}
      </div>
    </div>`;
  });

  document.getElementById('mainContent').innerHTML = html;
  updateTotal();
}

function selectAnswer(qi, oi){
  state.answers[state.current][qi] = oi;
  renderContent();
  renderNav();
  setTimeout(()=>{
    const card = document.getElementById(`qcard-${qi}`);
    if(card) card.scrollIntoView({behavior:'smooth', block:'nearest'});
  }, 100);
}

function resetScenario(i){
  state.answers[i] = new Array(scenarios[i].questions.length).fill(-1);
  renderNav();
  renderContent();
}

function updateTotal(){
  let total = 0, correct = 0;
  scenarios.forEach((s,i) => {
    s.questions.forEach((q,qi) => {
      if(state.answers[i][qi] !== -1){
        total++;
        if(state.answers[i][qi] === q.answer) correct++;
      }
    });
  });
  document.getElementById('totalScore').textContent = `${correct} / ${total}`;
}

// Shuffle option order once per page load so correct answer is not always A
(function shuffleOptions(){
  scenarios.forEach(s=>{
    s.questions.forEach(q=>{
      const idx=[0,1,2,3];
      for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
      const orig=q.opts.slice();
      q.opts=idx.map(i=>orig[i]);
      q.answer=idx.indexOf(q.answer);
    });
  });
})();

renderNav();
renderContent();
</script>
